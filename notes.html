<!DOCTYPE html>
<html lang="en" data-theme="cream">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reusable Content & Revision Viewer for Exam Notes, Important Questions, and Diagrams.">
  <title>Content Viewer | Exam Notes Portal</title>

  <!-- Modular CSS Architecture -->
  <link rel="stylesheet" href="assets/css/variables.css?v=1.2">
  <link rel="stylesheet" href="assets/css/base.css?v=1.2">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/notes-view.css?v=1.6">
  <link rel="stylesheet" href="assets/css/effects.css">

  <link rel="icon" href="assets/images/favicon.ico">
</head>
<body>
  <script>
    try {
      if (localStorage.getItem('portal_theme_preference') === 'dark') {
        localStorage.setItem('portal_theme_preference', 'cream');
      }
    } catch(e) {}
  </script>

  <!-- Reading Progress Bar -->
  <div class="reading-progress-track">
    <div class="reading-progress-fill" id="reading-progress-fill"></div>
  </div>

  <!-- Mobile Drawer Backdrop -->
  <div class="drawer-backdrop" id="drawer-backdrop"></div>

  <!-- Site Header -->
  <header class="site-header">
    <div class="container nav-container">
      <div style="display: flex; align-items: center; gap: var(--space-3);">
        <button class="btn-icon" data-action="toggle-sidebar" aria-label="Toggle navigation sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>

        <a href="index.html" class="brand-link">
          <div class="brand-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            </svg>
          </div>
          <span class="brand-title">ExamVault</span>
        </a>
      </div>

      <!-- Quick Search UI -->
      <div class="search-wrapper" style="max-width: 300px;">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="viewer-search-input" class="search-input" placeholder="Search..." autocomplete="off">
        </div>
        <div class="search-dropdown" id="viewer-search-dropdown"></div>
      </div>

      <!-- Actions -->
      <div class="header-actions">
        <button class="btn-icon" data-action="toggle-theme" title="Toggle Theme" aria-label="Toggle dark/light mode">
          <!-- Populated by JS -->
        </button>
        <a href="index.html" class="btn btn-secondary btn-sm">
          <span>← Subjects</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Viewer 3-Column Shell -->
  <div class="viewer-layout">

    <!-- Left Column: Navigation & Bookmarks Sidebar -->
    <aside class="viewer-sidebar" id="viewer-sidebar">
      <div class="viewer-sidebar-header">
        <div class="viewer-sidebar-title-row">
          <span class="viewer-sidebar-heading">Navigation</span>
        </div>
      </div>

      <!-- Tabs: Navigation vs Bookmarks -->
      <div class="viewer-sidebar-tabs">
        <button class="sidebar-tab-btn active" data-tab="nav">Content Tree</button>
        <button class="sidebar-tab-btn" data-tab="bookmarks">Bookmarks</button>
      </div>

      <!-- Dynamic Navigation Items Container -->
      <div class="viewer-sidebar-content" id="sidebar-nav-container">
        <!-- Rendered dynamically by navigation.js -->
      </div>
    </aside>

    <!-- Center Column: Main Reading Workspace -->
    <main class="viewer-main-content">
      <article class="reading-container">

        <!-- Toolbar: Breadcrumbs & Readability Controls -->
        <div class="viewer-toolbar">
          <nav class="breadcrumbs" id="viewer-breadcrumbs" aria-label="Breadcrumb">
            <a href="index.html">Portal</a>
            <span class="breadcrumb-separator">/</span>
            <span class="breadcrumb-current">Viewer</span>
          </nav>

          <div class="reading-controls">
            <button class="btn-icon" id="btn-zoom-out" title="Decrease font size" style="width: 2rem; height: 2rem; font-size: var(--text-xs); font-family: var(--font-mono);">A-</button>
            <button class="btn-icon" id="btn-zoom-in" title="Increase font size" style="width: 2rem; height: 2rem; font-size: var(--text-xs); font-family: var(--font-mono);">A+</button>
            <button class="btn btn-secondary btn-sm" id="btn-print-view" title="Print note or save as PDF">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 6 2 18 2 18 9"></polyline>
                <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                <rect x="6" y="14" width="12" height="8"></rect>
              </svg>
              <span>Print</span>
            </button>
          </div>
        </div>

        <!-- Note / Content Meta Header (Badges & Bookmark button) -->
        <header class="content-meta-header" id="content-meta-header" style="display: none;">
          <!-- Rendered dynamically by viewer.js -->
        </header>

        <!-- Main Dynamic Content Body -->
        <div class="content-body" id="viewer-content">
          <!-- Rendered dynamically by parser.js -->
        </div>

        <!-- Previous / Next Navigation Footer -->
        <nav class="viewer-pagination-footer" id="viewer-pagination" aria-label="Content pagination" style="display: none;">
          <!-- Rendered dynamically by navigation.js -->
        </nav>

      </article>
    </main>

    <!-- Right Column: Dynamic Table of Contents (TOC) -->
    <aside class="viewer-toc-column" id="viewer-toc-column">
      <div class="toc-card">
        <div class="toc-heading">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="8" y1="6" x2="21" y2="6"></line>
            <line x1="8" y1="12" x2="21" y2="12"></line>
            <line x1="8" y1="18" x2="21" y2="18"></line>
            <line x1="3" y1="6" x2="3.01" y2="6"></line>
            <line x1="3" y1="12" x2="3.01" y2="12"></line>
            <line x1="3" y1="18" x2="3.01" y2="18"></line>
          </svg>
          <span>On This Page</span>
        </div>
        <div id="toc-content">
          <!-- Rendered dynamically by navigation.js -->
        </div>
      </div>
    </aside>

  </div>

  <!-- CDN Dependencies: Marked.js for Markdown & Prism.js for Syntax Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>

  <!-- Viewer Application Controller -->
  <script type="module" src="assets/js/viewer.js?v=1.3"></script>
</body>
</html>
