<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 490" width="100%" height="100%">
  <defs>
    <linearGradient id="travBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <marker id="bfsArrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 10 5 L 0 8 z" fill="#06b6d4" />
    </marker>
    <marker id="dfsArrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 10 5 L 0 8 z" fill="#f43f5e" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="490" rx="16" fill="url(#travBg)" stroke="#334155" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(36, 24)">
    <rect width="5" height="26" rx="2.5" fill="#818cf8" />
    <text x="16" y="20" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">
      Graph Traversals Compared: BFS (Queue) vs DFS (Stack / Recursion)
    </text>
    <text x="16" y="38" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
      Both run in O(V + E) time using an Adjacency List. Traversal strategy dictates exploration order.
    </text>
  </g>

  <!-- Left: BFS (Breadth-First Search) -->
  <g transform="translate(36, 75)">
    <rect width="380" height="300" rx="12" fill="#131d31" stroke="#06b6d4" stroke-width="1.2" />
    
    <!-- Title Badge -->
    <rect x="16" y="14" width="170" height="26" rx="6" fill="#083344" stroke="#06b6d4" />
    <text x="101" y="32" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">BFS (Level-by-Level)</text>

    <!-- Queue indicator -->
    <rect x="200" y="14" width="160" height="26" rx="6" fill="#1e293b" />
    <text x="280" y="31" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Data Structure: <tspan font-weight="700" fill="#38bdf8">FIFO Queue</tspan></text>

    <!-- Graph Diagram for BFS -->
    <g transform="translate(30, 60)">
      <!-- Level contours / bands -->
      <rect x="0" y="0" width="320" height="40" rx="6" fill="#082f49" opacity="0.4" />
      <text x="310" y="25" font-family="sans-serif" font-size="10" fill="#38bdf8" text-anchor="end">Level 0</text>

      <rect x="0" y="55" width="320" height="40" rx="6" fill="#082f49" opacity="0.4" />
      <text x="310" y="80" font-family="sans-serif" font-size="10" fill="#38bdf8" text-anchor="end">Level 1</text>

      <rect x="0" y="110" width="320" height="40" rx="6" fill="#082f49" opacity="0.4" />
      <text x="310" y="135" font-family="sans-serif" font-size="10" fill="#38bdf8" text-anchor="end">Level 2</text>

      <!-- Edges -->
      <line x1="160" y1="20" x2="80" y2="75" stroke="#475569" stroke-width="2" />
      <line x1="160" y1="20" x2="240" y2="75" stroke="#475569" stroke-width="2" />
      <line x1="80" y1="75" x2="50" y2="130" stroke="#475569" stroke-width="2" />
      <line x1="80" y1="75" x2="110" y2="130" stroke="#475569" stroke-width="2" />
      <line x1="240" y1="75" x2="240" y2="130" stroke="#475569" stroke-width="2" />

      <!-- Nodes with visit order 1, 2, 3, 4, 5, 6 -->
      <!-- Node A: 1 -->
      <circle cx="160" cy="20" r="16" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
      <text x="160" y="25" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">A [1]</text>

      <!-- Node B: 2 -->
      <circle cx="80" cy="75" r="16" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5" />
      <text x="80" y="80" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">B [2]</text>

      <!-- Node C: 3 -->
      <circle cx="240" cy="75" r="16" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5" />
      <text x="240" y="80" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">C [3]</text>

      <!-- Node D: 4 -->
      <circle cx="50" cy="130" r="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <text x="50" y="135" font-family="sans-serif" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">D [4]</text>

      <!-- Node E: 5 -->
      <circle cx="110" cy="130" r="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <text x="110" y="135" font-family="sans-serif" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">E [5]</text>

      <!-- Node F: 6 -->
      <circle cx="240" cy="130" r="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <text x="240" y="135" font-family="sans-serif" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">F [6]</text>
    </g>

    <!-- Visit Sequence Box -->
    <g transform="translate(16, 235)">
      <rect width="348" height="48" rx="6" fill="#082f49" stroke="#0284c7" />
      <text x="12" y="20" font-family="sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Visit Order (BFS):</text>
      <text x="12" y="38" font-family="monospace" font-size="13" font-weight="700" fill="#ecfeff">A → B → C → D → E → F</text>
      <text x="336" y="28" font-family="sans-serif" font-size="10" fill="#a5f3fc" text-anchor="end">Shortest path in unweighted graph</text>
    </g>
  </g>

  <!-- Right: DFS (Depth-First Search) -->
  <g transform="translate(444, 75)">
    <rect width="380" height="300" rx="12" fill="#131d31" stroke="#f43f5e" stroke-width="1.2" />
    
    <!-- Title Badge -->
    <rect x="16" y="14" width="170" height="26" rx="6" fill="#4c0519" stroke="#f43f5e" />
    <text x="101" y="32" font-family="sans-serif" font-size="12" font-weight="700" fill="#fb7185" text-anchor="middle">DFS (Deep Exploration)</text>

    <!-- Stack indicator -->
    <rect x="200" y="14" width="160" height="26" rx="6" fill="#1e293b" />
    <text x="280" y="31" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Data Structure: <tspan font-weight="700" fill="#fb7185">LIFO Stack / Call Stack</tspan></text>

    <!-- Graph Diagram for DFS -->
    <g transform="translate(30, 60)">
      <!-- Edges with traversal direction arrows -->
      <line x1="160" y1="20" x2="80" y2="75" stroke="#f43f5e" stroke-width="2.5" />
      <line x1="80" y1="75" x2="50" y2="130" stroke="#f43f5e" stroke-width="2.5" />
      <line x1="80" y1="75" x2="110" y2="130" stroke="#cbd5e1" stroke-dasharray="3 3" />
      <line x1="160" y1="20" x2="240" y2="75" stroke="#cbd5e1" stroke-dasharray="3 3" />
      <line x1="240" y1="75" x2="240" y2="130" stroke="#cbd5e1" />

      <!-- Nodes with visit order 1, 2, 3, 4, 5, 6 -->
      <!-- Node A: 1 -->
      <circle cx="160" cy="20" r="16" fill="#be123c" stroke="#f43f5e" stroke-width="2" />
      <text x="160" y="25" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">A [1]</text>

      <!-- Node B: 2 -->
      <circle cx="80" cy="75" r="16" fill="#9f1239" stroke="#f43f5e" stroke-width="2" />
      <text x="80" y="80" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">B [2]</text>

      <!-- Node D: 3 (Deepest down branch B) -->
      <circle cx="50" cy="130" r="16" fill="#881337" stroke="#f43f5e" stroke-width="2" />
      <text x="50" y="135" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">D [3]</text>

      <!-- Node E: 4 (Backtrack to B, then explore E) -->
      <circle cx="110" cy="130" r="16" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" />
      <text x="110" y="135" font-family="sans-serif" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">E [4]</text>

      <!-- Node C: 5 (Backtrack to A, explore C) -->
      <circle cx="240" cy="75" r="16" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" />
      <text x="240" y="80" font-family="sans-serif" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">C [5]</text>

      <!-- Node F: 6 (Deep down C) -->
      <circle cx="240" cy="130" r="16" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" />
      <text x="240" y="135" font-family="sans-serif" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">F [6]</text>
    </g>

    <!-- Visit Sequence Box -->
    <g transform="translate(16, 235)">
      <rect width="348" height="48" rx="6" fill="#4c0519" stroke="#be123c" />
      <text x="12" y="20" font-family="sans-serif" font-size="11" font-weight="700" fill="#fb7185">Visit Order (DFS):</text>
      <text x="12" y="38" font-family="monospace" font-size="13" font-weight="700" fill="#ffe4e6">A → B → D → E → C → F</text>
      <text x="336" y="28" font-family="sans-serif" font-size="10" fill="#fecdd3" text-anchor="end">Cycle detection &amp; Topological sort</text>
    </g>
  </g>

  <!-- Bottom Complexity & Exam Comparison Table -->
  <g transform="translate(36, 390)">
    <rect width="788" height="85" rx="8" fill="#0f172a" stroke="#334155" />
    <g transform="translate(20, 15)">
      <text x="0" y="16" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#818cf8">Complexity &amp; Space Comparison:</text>
      <text x="0" y="38" font-family="sans-serif" font-size="11" fill="#cbd5e1">• <tspan font-weight="700" fill="#f8fafc">Time Complexity:</tspan> O(V + E) with Adjacency List | O(V²) with Adjacency Matrix (Both BFS &amp; DFS).</text>
      <text x="0" y="56" font-family="sans-serif" font-size="11" fill="#cbd5e1">• <tspan font-weight="700" fill="#f8fafc">Space Complexity:</tspan> BFS uses <tspan fill="#38bdf8" font-weight="600">O(W)</tspan> where W is maximum graph width; DFS uses <tspan fill="#fb7185" font-weight="600">O(H)</tspan> where H is max tree depth.</text>
    </g>
  </g>
</svg>
