<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <rect width="820" height="460" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(36, 26)">
    <rect width="5" height="26" rx="2.5" fill="#f59e0b" />
    <text x="16" y="20" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">
      Bubble Sort: {25, 12, 9, 30, 18} Step-by-Step Passes
    </text>
    <text x="16" y="38" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
      Adjacent comparisons bubble largest element to end. Total Comparisons = 4 + 3 + 2 = 9
    </text>
  </g>

  <g transform="translate(40, 80)">

    <!-- Initial Array -->
    <g transform="translate(0, 0)">
      <rect width="130" height="46" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="65" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="middle">Initial Array</text>
      
      <g transform="translate(150, 0)">
        <rect x="0" y="0" width="56" height="46" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="28" y="28" font-family="mono, sans-serif" font-size="15" font-weight="600" fill="#cbd5e1" text-anchor="middle">25</text>

        <rect x="64" y="0" width="56" height="46" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="92" y="28" font-family="mono, sans-serif" font-size="15" font-weight="600" fill="#cbd5e1" text-anchor="middle">12</text>

        <rect x="128" y="0" width="56" height="46" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="156" y="28" font-family="mono, sans-serif" font-size="15" font-weight="600" fill="#cbd5e1" text-anchor="middle">9</text>

        <rect x="192" y="0" width="56" height="46" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="220" y="28" font-family="mono, sans-serif" font-size="15" font-weight="600" fill="#cbd5e1" text-anchor="middle">30</text>

        <rect x="256" y="0" width="56" height="46" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="284" y="28" font-family="mono, sans-serif" font-size="15" font-weight="600" fill="#cbd5e1" text-anchor="middle">18</text>
      </g>
      <text x="490" y="28" font-family="sans-serif" font-size="12" fill="#64748b">Unsorted 5 elements</text>
    </g>

    <!-- Pass 1: 4 comparisons -->
    <g transform="translate(0, 65)">
      <rect width="130" height="46" rx="6" fill="#1e293b" stroke="#f59e0b" />
      <text x="65" y="22" font-family="sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle">Pass 1</text>
      <text x="65" y="37" font-family="sans-serif" font-size="10" fill="#fde68a" text-anchor="middle">4 Comparisons</text>
      
      <g transform="translate(150, 0)">
        <rect x="0" y="0" width="56" height="46" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="28" y="28" font-family="mono, sans-serif" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">12</text>

        <rect x="64" y="0" width="56" height="46" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="92" y="28" font-family="mono, sans-serif" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">9</text>

        <rect x="128" y="0" width="56" height="46" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="156" y="28" font-family="mono, sans-serif" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">25</text>

        <rect x="192" y="0" width="56" height="46" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="220" y="28" font-family="mono, sans-serif" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">18</text>

        <rect x="256" y="0" width="56" height="46" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1.8" />
        <text x="284" y="28" font-family="mono, sans-serif" font-size="15" font-weight="800" fill="#34d399" text-anchor="middle">30</text>
      </g>
      <text x="490" y="28" font-family="sans-serif" font-size="12" fill="#38bdf8">30 bubbles to final position (index 4)</text>
    </g>

    <!-- Pass 2: 3 comparisons -->
    <g transform="translate(0, 130)">
      <rect width="130" height="46" rx="6" fill="#1e293b" stroke="#f59e0b" />
      <text x="65" y="22" font-family="sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle">Pass 2</text>
      <text x="65" y="37" font-family="sans-serif" font-size="10" fill="#fde68a" text-anchor="middle">3 Comparisons</text>
      
      <g transform="translate(150, 0)">
        <rect x="0" y="0" width="56" height="46" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="28" y="28" font-family="mono, sans-serif" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">9</text>

        <rect x="64" y="0" width="56" height="46" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="92" y="28" font-family="mono, sans-serif" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">12</text>

        <rect x="128" y="0" width="56" height="46" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="156" y="28" font-family="mono, sans-serif" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">18</text>

        <rect x="192" y="0" width="56" height="46" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1.8" />
        <text x="220" y="28" font-family="mono, sans-serif" font-size="15" font-weight="800" fill="#34d399" text-anchor="middle">25</text>

        <rect x="256" y="0" width="56" height="46" rx="6" fill="#065f46" stroke="#10b981" />
        <text x="284" y="28" font-family="mono, sans-serif" font-size="15" font-weight="800" fill="#34d399" text-anchor="middle">30</text>
      </g>
      <text x="490" y="28" font-family="sans-serif" font-size="12" fill="#38bdf8">25 bubbles to final position (index 3)</text>
    </g>

    <!-- Pass 3: 2 comparisons (early stop) -->
    <g transform="translate(0, 195)">
      <rect width="130" height="46" rx="6" fill="#1e293b" stroke="#10b981" />
      <text x="65" y="22" font-family="sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">Pass 3</text>
      <text x="65" y="37" font-family="sans-serif" font-size="10" fill="#a7f3d0" text-anchor="middle">2 Comparisons</text>
      
      <g transform="translate(150, 0)">
        <rect x="0" y="0" width="56" height="46" rx="6" fill="#047857" stroke="#34d399" stroke-width="2" />
        <text x="28" y="28" font-family="mono, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">9</text>

        <rect x="64" y="0" width="56" height="46" rx="6" fill="#047857" stroke="#34d399" stroke-width="2" />
        <text x="92" y="28" font-family="mono, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">12</text>

        <rect x="128" y="0" width="56" height="46" rx="6" fill="#047857" stroke="#34d399" stroke-width="2" />
        <text x="156" y="28" font-family="mono, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">18</text>

        <rect x="192" y="0" width="56" height="46" rx="6" fill="#047857" stroke="#34d399" stroke-width="2" />
        <text x="220" y="28" font-family="mono, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">25</text>

        <rect x="256" y="0" width="56" height="46" rx="6" fill="#047857" stroke="#34d399" stroke-width="2" />
        <text x="284" y="28" font-family="mono, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">30</text>
      </g>
      <text x="490" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#34d399">0 Swaps → Early Termination Flag ✓</text>
    </g>

    <!-- Total comparisons summary -->
    <g transform="translate(0, 275)">
      <rect width="740" height="46" rx="8" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1.2" />
      <text x="24" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#c7d2fe">
        Total Comparisons = 4 + 3 + 2 = 9 Comparisons | Sorted Array: [9, 12, 18, 25, 30]
      </text>
    </g>
  </g>
</svg>
