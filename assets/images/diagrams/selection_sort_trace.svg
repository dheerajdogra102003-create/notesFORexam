<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <rect width="820" height="460" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(36, 26)">
    <rect width="5" height="26" rx="2.5" fill="#06b6d4" />
    <text x="16" y="20" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">
      Selection Sort: [64, 25, 12, 22, 11] Step-by-Step Passes
    </text>
    <text x="16" y="38" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
      Repeatedly finds minimum from unsorted portion and swaps to beginning. Comparisons = n(n-1)/2 = 10
    </text>
  </g>

  <g transform="translate(40, 75)">

    <!-- Initial Array -->
    <g transform="translate(0, 0)">
      <rect width="130" height="44" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="65" y="27" font-family="sans-serif" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="middle">Initial</text>
      
      <g transform="translate(150, 0)">
        <rect x="0" y="0" width="56" height="44" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="28" y="27" font-family="mono, sans-serif" font-size="14" font-weight="600" fill="#cbd5e1" text-anchor="middle">64</text>

        <rect x="64" y="0" width="56" height="44" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="92" y="27" font-family="mono, sans-serif" font-size="14" font-weight="600" fill="#cbd5e1" text-anchor="middle">25</text>

        <rect x="128" y="0" width="56" height="44" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="156" y="27" font-family="mono, sans-serif" font-size="14" font-weight="600" fill="#cbd5e1" text-anchor="middle">12</text>

        <rect x="192" y="0" width="56" height="44" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="220" y="27" font-family="mono, sans-serif" font-size="14" font-weight="600" fill="#cbd5e1" text-anchor="middle">22</text>

        <rect x="256" y="0" width="56" height="44" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="284" y="27" font-family="mono, sans-serif" font-size="14" font-weight="600" fill="#cbd5e1" text-anchor="middle">11</text>
      </g>
      <text x="490" y="27" font-family="sans-serif" font-size="12" fill="#64748b">Unsorted array of 5 elements</text>
    </g>

    <!-- Pass 1: Min = 11 -->
    <g transform="translate(0, 58)">
      <rect width="130" height="44" rx="6" fill="#1e293b" stroke="#06b6d4" />
      <text x="65" y="27" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">Pass 1: Min 11</text>
      
      <g transform="translate(150, 0)">
        <rect x="0" y="0" width="56" height="44" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1.8" />
        <text x="28" y="27" font-family="mono, sans-serif" font-size="14" font-weight="800" fill="#34d399" text-anchor="middle">11</text>

        <rect x="64" y="0" width="56" height="44" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="92" y="27" font-family="mono, sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">25</text>

        <rect x="128" y="0" width="56" height="44" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="156" y="27" font-family="mono, sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">12</text>

        <rect x="192" y="0" width="56" height="44" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="220" y="27" font-family="mono, sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">22</text>

        <rect x="256" y="0" width="56" height="44" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="284" y="27" font-family="mono, sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">64</text>
      </g>
      <text x="490" y="27" font-family="sans-serif" font-size="12" fill="#38bdf8">Min 11 swapped with 64 at index 0</text>
    </g>

    <!-- Pass 2: Min = 12 -->
    <g transform="translate(0, 116)">
      <rect width="130" height="44" rx="6" fill="#1e293b" stroke="#06b6d4" />
      <text x="65" y="27" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">Pass 2: Min 12</text>
      
      <g transform="translate(150, 0)">
        <rect x="0" y="0" width="56" height="44" rx="6" fill="#065f46" stroke="#10b981" />
        <text x="28" y="27" font-family="mono, sans-serif" font-size="14" font-weight="800" fill="#34d399" text-anchor="middle">11</text>

        <rect x="64" y="0" width="56" height="44" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1.8" />
        <text x="92" y="27" font-family="mono, sans-serif" font-size="14" font-weight="800" fill="#34d399" text-anchor="middle">12</text>

        <rect x="128" y="0" width="56" height="44" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="156" y="27" font-family="mono, sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">25</text>

        <rect x="192" y="0" width="56" height="44" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="220" y="27" font-family="mono, sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">22</text>

        <rect x="256" y="0" width="56" height="44" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="284" y="27" font-family="mono, sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">64</text>
      </g>
      <text x="490" y="27" font-family="sans-serif" font-size="12" fill="#38bdf8">Min 12 swapped with 25 at index 1</text>
    </g>

    <!-- Pass 3: Min = 22 -->
    <g transform="translate(0, 174)">
      <rect width="130" height="44" rx="6" fill="#1e293b" stroke="#06b6d4" />
      <text x="65" y="27" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">Pass 3: Min 22</text>
      
      <g transform="translate(150, 0)">
        <rect x="0" y="0" width="56" height="44" rx="6" fill="#065f46" stroke="#10b981" />
        <text x="28" y="27" font-family="mono, sans-serif" font-size="14" font-weight="800" fill="#34d399" text-anchor="middle">11</text>

        <rect x="64" y="0" width="56" height="44" rx="6" fill="#065f46" stroke="#10b981" />
        <text x="92" y="27" font-family="mono, sans-serif" font-size="14" font-weight="800" fill="#34d399" text-anchor="middle">12</text>

        <rect x="128" y="0" width="56" height="44" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1.8" />
        <text x="156" y="27" font-family="mono, sans-serif" font-size="14" font-weight="800" fill="#34d399" text-anchor="middle">22</text>

        <rect x="192" y="0" width="56" height="44" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="220" y="27" font-family="mono, sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">25</text>

        <rect x="256" y="0" width="56" height="44" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="284" y="27" font-family="mono, sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">64</text>
      </g>
      <text x="490" y="27" font-family="sans-serif" font-size="12" fill="#38bdf8">Min 22 swapped with 25 at index 2</text>
    </g>

    <!-- Pass 4: Min = 25 -->
    <g transform="translate(0, 232)">
      <rect width="130" height="44" rx="6" fill="#1e293b" stroke="#10b981" />
      <text x="65" y="27" font-family="sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">Pass 4: Min 25</text>
      
      <g transform="translate(150, 0)">
        <rect x="0" y="0" width="56" height="44" rx="6" fill="#047857" stroke="#34d399" stroke-width="2" />
        <text x="28" y="27" font-family="mono, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">11</text>

        <rect x="64" y="0" width="56" height="44" rx="6" fill="#047857" stroke="#34d399" stroke-width="2" />
        <text x="92" y="27" font-family="mono, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">12</text>

        <rect x="128" y="0" width="56" height="44" rx="6" fill="#047857" stroke="#34d399" stroke-width="2" />
        <text x="156" y="27" font-family="mono, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">22</text>

        <rect x="192" y="0" width="56" height="44" rx="6" fill="#047857" stroke="#34d399" stroke-width="2" />
        <text x="220" y="27" font-family="mono, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">25</text>

        <rect x="256" y="0" width="56" height="44" rx="6" fill="#047857" stroke="#34d399" stroke-width="2" />
        <text x="284" y="27" font-family="mono, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">64</text>
      </g>
      <text x="490" y="27" font-family="sans-serif" font-size="12" font-weight="700" fill="#34d399">✓ 64 in place → Fully Sorted</text>
    </g>

    <!-- Selection Sort Summary Banner -->
    <g transform="translate(0, 305)">
      <rect width="740" height="46" rx="8" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1.2" />
      <text x="24" y="28" font-family="sans-serif" font-size="12" font-weight="600" fill="#c7d2fe">
        Selection Sort: Comparisons = n(n-1)/2 = 10 (always) | Time: O(n²) all cases | Stable: ❌ | In-Place: ✅
      </text>
    </g>
  </g>
</svg>
