<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="100%" height="100%">
  <defs>
    <linearGradient id="radixBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <marker id="passArrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 10 5 L 0 8 z" fill="#a855f7" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="480" rx="16" fill="url(#radixBg)" stroke="#334155" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(36, 22)">
    <rect width="5" height="26" rx="2.5" fill="#a855f7" />
    <text x="16" y="20" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">
      Radix Sort (LSD): Multi-Pass Digit Sorting Execution Trace
    </text>
    <text x="16" y="38" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
      Non-comparative sorting using Counting Sort subroutine on each digit position from least to most significant.
    </text>
  </g>

  <!-- Row 0: Original Unsorted Array -->
  <g transform="translate(36, 75)">
    <rect width="130" height="42" rx="6" fill="#1e293b" stroke="#475569" />
    <text x="65" y="26" font-family="sans-serif" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="middle">Initial Array</text>
    
    <g transform="translate(150, 0)">
      <!-- 8 elements -->
      <!-- 170, 045, 075, 090, 802, 024, 002, 066 -->
      <g transform="translate(0, 0)"><rect width="58" height="42" rx="6" fill="#1e293b" stroke="#334155" /><text x="29" y="26" font-family="monospace" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">170</text></g>
      <g transform="translate(64, 0)"><rect width="58" height="42" rx="6" fill="#1e293b" stroke="#334155" /><text x="29" y="26" font-family="monospace" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">045</text></g>
      <g transform="translate(128, 0)"><rect width="58" height="42" rx="6" fill="#1e293b" stroke="#334155" /><text x="29" y="26" font-family="monospace" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">075</text></g>
      <g transform="translate(192, 0)"><rect width="58" height="42" rx="6" fill="#1e293b" stroke="#334155" /><text x="29" y="26" font-family="monospace" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">090</text></g>
      <g transform="translate(256, 0)"><rect width="58" height="42" rx="6" fill="#1e293b" stroke="#334155" /><text x="29" y="26" font-family="monospace" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">802</text></g>
      <g transform="translate(320, 0)"><rect width="58" height="42" rx="6" fill="#1e293b" stroke="#334155" /><text x="29" y="26" font-family="monospace" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">024</text></g>
      <g transform="translate(384, 0)"><rect width="58" height="42" rx="6" fill="#1e293b" stroke="#334155" /><text x="29" y="26" font-family="monospace" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">002</text></g>
      <g transform="translate(448, 0)"><rect width="58" height="42" rx="6" fill="#1e293b" stroke="#334155" /><text x="29" y="26" font-family="monospace" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">066</text></g>
    </g>
    <text x="750" y="26" font-family="sans-serif" font-size="12" fill="#64748b">Max digits d = 3</text>
  </g>

  <!-- Pass 1: LSD (Units Place - 10^0) -->
  <g transform="translate(36, 135)">
    <rect width="130" height="52" rx="6" fill="#1e293b" stroke="#a855f7" />
    <text x="65" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#c084fc" text-anchor="middle">Pass 1: Units</text>
    <text x="65" y="42" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Key = val % 10</text>

    <g transform="translate(150, 0)">
      <!-- Result: [170, 090, 802, 002, 024, 045, 075, 066] -->
      <g transform="translate(0, 0)"><rect width="58" height="52" rx="6" fill="#2e1065" stroke="#a855f7" /><text x="29" y="32" font-family="monospace" font-size="15" font-weight="700" fill="#f3e8ff" text-anchor="middle">17<tspan fill="#ec4899">0</tspan></text></g>
      <g transform="translate(64, 0)"><rect width="58" height="52" rx="6" fill="#2e1065" stroke="#a855f7" /><text x="29" y="32" font-family="monospace" font-size="15" font-weight="700" fill="#f3e8ff" text-anchor="middle">09<tspan fill="#ec4899">0</tspan></text></g>
      <g transform="translate(128, 0)"><rect width="58" height="52" rx="6" fill="#2e1065" stroke="#a855f7" /><text x="29" y="32" font-family="monospace" font-size="15" font-weight="700" fill="#f3e8ff" text-anchor="middle">80<tspan fill="#ec4899">2</tspan></text></g>
      <g transform="translate(192, 0)"><rect width="58" height="52" rx="6" fill="#2e1065" stroke="#a855f7" /><text x="29" y="32" font-family="monospace" font-size="15" font-weight="700" fill="#f3e8ff" text-anchor="middle">00<tspan fill="#ec4899">2</tspan></text></g>
      <g transform="translate(256, 0)"><rect width="58" height="52" rx="6" fill="#2e1065" stroke="#a855f7" /><text x="29" y="32" font-family="monospace" font-size="15" font-weight="700" fill="#f3e8ff" text-anchor="middle">02<tspan fill="#ec4899">4</tspan></text></g>
      <g transform="translate(320, 0)"><rect width="58" height="52" rx="6" fill="#2e1065" stroke="#a855f7" /><text x="29" y="32" font-family="monospace" font-size="15" font-weight="700" fill="#f3e8ff" text-anchor="middle">04<tspan fill="#ec4899">5</tspan></text></g>
      <g transform="translate(384, 0)"><rect width="58" height="52" rx="6" fill="#2e1065" stroke="#a855f7" /><text x="29" y="32" font-family="monospace" font-size="15" font-weight="700" fill="#f3e8ff" text-anchor="middle">07<tspan fill="#ec4899">5</tspan></text></g>
      <g transform="translate(448, 0)"><rect width="58" height="52" rx="6" fill="#2e1065" stroke="#a855f7" /><text x="29" y="32" font-family="monospace" font-size="15" font-weight="700" fill="#f3e8ff" text-anchor="middle">06<tspan fill="#ec4899">6</tspan></text></g>
    </g>
    <text x="670" y="32" font-family="sans-serif" font-size="12" fill="#c084fc">Sorted by last digit</text>
  </g>

  <!-- Pass 2: Tens Place (10^1) -->
  <g transform="translate(36, 205)">
    <rect width="130" height="52" rx="6" fill="#1e293b" stroke="#38bdf8" />
    <text x="65" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">Pass 2: Tens</text>
    <text x="65" y="42" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Key = (val/10)%10</text>

    <g transform="translate(150, 0)">
      <!-- Result: [802, 002, 024, 045, 066, 170, 075, 090] -->
      <g transform="translate(0, 0)"><rect width="58" height="52" rx="6" fill="#082f49" stroke="#38bdf8" /><text x="29" y="32" font-family="monospace" font-size="15" font-weight="700" fill="#e0f2fe" text-anchor="middle">8<tspan fill="#38bdf8">0</tspan>2</text></g>
      <g transform="translate(64, 0)"><rect width="58" height="52" rx="6" fill="#082f49" stroke="#38bdf8" /><text x="29" y="32" font-family="monospace" font-size="15" font-weight="700" fill="#e0f2fe" text-anchor="middle">0<tspan fill="#38bdf8">0</tspan>2</text></g>
      <g transform="translate(128, 0)"><rect width="58" height="52" rx="6" fill="#082f49" stroke="#38bdf8" /><text x="29" y="32" font-family="monospace" font-size="15" font-weight="700" fill="#e0f2fe" text-anchor="middle">0<tspan fill="#38bdf8">2</tspan>4</text></g>
      <g transform="translate(192, 0)"><rect width="58" height="52" rx="6" fill="#082f49" stroke="#38bdf8" /><text x="29" y="32" font-family="monospace" font-size="15" font-weight="700" fill="#e0f2fe" text-anchor="middle">0<tspan fill="#38bdf8">4</tspan>5</text></g>
      <g transform="translate(256, 0)"><rect width="58" height="52" rx="6" fill="#082f49" stroke="#38bdf8" /><text x="29" y="32" font-family="monospace" font-size="15" font-weight="700" fill="#e0f2fe" text-anchor="middle">0<tspan fill="#38bdf8">6</tspan>6</text></g>
      <g transform="translate(320, 0)"><rect width="58" height="52" rx="6" fill="#082f49" stroke="#38bdf8" /><text x="29" y="32" font-family="monospace" font-size="15" font-weight="700" fill="#e0f2fe" text-anchor="middle">1<tspan fill="#38bdf8">7</tspan>0</text></g>
      <g transform="translate(384, 0)"><rect width="58" height="52" rx="6" fill="#082f49" stroke="#38bdf8" /><text x="29" y="32" font-family="monospace" font-size="15" font-weight="700" fill="#e0f2fe" text-anchor="middle">0<tspan fill="#38bdf8">7</tspan>5</text></g>
      <g transform="translate(448, 0)"><rect width="58" height="52" rx="6" fill="#082f49" stroke="#38bdf8" /><text x="29" y="32" font-family="monospace" font-size="15" font-weight="700" fill="#e0f2fe" text-anchor="middle">0<tspan fill="#38bdf8">9</tspan>0</text></g>
    </g>
    <text x="670" y="32" font-family="sans-serif" font-size="12" fill="#38bdf8">Stable relative order</text>
  </g>

  <!-- Pass 3: MSD (Hundreds Place - 10^2) -->
  <g transform="translate(36, 275)">
    <rect width="130" height="52" rx="6" fill="#1e293b" stroke="#10b981" />
    <text x="65" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">Pass 3: Hundreds</text>
    <text x="65" y="42" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Key = (val/100)%10</text>

    <g transform="translate(150, 0)">
      <!-- Result: [002, 024, 045, 066, 075, 090, 170, 802] -->
      <g transform="translate(0, 0)"><rect width="58" height="52" rx="6" fill="#064e3b" stroke="#10b981" /><text x="29" y="32" font-family="monospace" font-size="15" font-weight="700" fill="#ecfdf5" text-anchor="middle"><tspan fill="#34d399">0</tspan>02</text></g>
      <g transform="translate(64, 0)"><rect width="58" height="52" rx="6" fill="#064e3b" stroke="#10b981" /><text x="29" y="32" font-family="monospace" font-size="15" font-weight="700" fill="#ecfdf5" text-anchor="middle"><tspan fill="#34d399">0</tspan>24</text></g>
      <g transform="translate(128, 0)"><rect width="58" height="52" rx="6" fill="#064e3b" stroke="#10b981" /><text x="29" y="32" font-family="monospace" font-size="15" font-weight="700" fill="#ecfdf5" text-anchor="middle"><tspan fill="#34d399">0</tspan>45</text></g>
      <g transform="translate(192, 0)"><rect width="58" height="52" rx="6" fill="#064e3b" stroke="#10b981" /><text x="29" y="32" font-family="monospace" font-size="15" font-weight="700" fill="#ecfdf5" text-anchor="middle"><tspan fill="#34d399">0</tspan>66</text></g>
      <g transform="translate(256, 0)"><rect width="58" height="52" rx="6" fill="#064e3b" stroke="#10b981" /><text x="29" y="32" font-family="monospace" font-size="15" font-weight="700" fill="#ecfdf5" text-anchor="middle"><tspan fill="#34d399">0</tspan>75</text></g>
      <g transform="translate(320, 0)"><rect width="58" height="52" rx="6" fill="#064e3b" stroke="#10b981" /><text x="29" y="32" font-family="monospace" font-size="15" font-weight="700" fill="#ecfdf5" text-anchor="middle"><tspan fill="#34d399">0</tspan>90</text></g>
      <g transform="translate(384, 0)"><rect width="58" height="52" rx="6" fill="#064e3b" stroke="#10b981" /><text x="29" y="32" font-family="monospace" font-size="15" font-weight="700" fill="#ecfdf5" text-anchor="middle"><tspan fill="#34d399">1</tspan>70</text></g>
      <g transform="translate(448, 0)"><rect width="58" height="52" rx="6" fill="#064e3b" stroke="#10b981" /><text x="29" y="32" font-family="monospace" font-size="15" font-weight="700" fill="#ecfdf5" text-anchor="middle"><tspan fill="#34d399">8</tspan>02</text></g>
    </g>
    <text x="670" y="32" font-family="sans-serif" font-size="12" fill="#34d399" font-weight="700">✓ Fully Sorted!</text>
  </g>

  <!-- Bottom Explanatory Summary Bar -->
  <g transform="translate(36, 350)">
    <rect width="788" height="95" rx="10" fill="#0f172a" stroke="#334155" />
    <g transform="translate(20, 18)">
      <text x="0" y="16" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#a855f7">Key Properties of Radix Sort:</text>
      <text x="0" y="40" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">• <tspan font-weight="600" fill="#f8fafc">Stability is Critical:</tspan> Counting sort preserves relative order from previous digit passes.</text>
      <text x="0" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">• <tspan font-weight="600" fill="#f8fafc">Time Complexity:</tspan> O(d · (n + b)) where d = number of digits (3), n = elements (8), b = radix base (10) → <tspan fill="#34d399" font-weight="700">Linear O(n)</tspan> for fixed digits.</text>
      
      <text x="560" y="40" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Space Complexity: <tspan fill="#f8fafc" font-weight="700">O(n + b)</tspan></text>
      <text x="560" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Comparison-free: <tspan fill="#10b981" font-weight="700">Beats O(n log n)</tspan></text>
    </g>
  </g>
</svg>
