<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="nodeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="nodeRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="nodeGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 10 5 L 0 8 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="840" height="480" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(36, 26)">
    <rect width="5" height="26" rx="2.5" fill="#f59e0b" />
    <text x="16" y="20" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">
      Dynamic Programming: Overlapping Subproblems in fib(5)
    </text>
    <text x="16" y="38" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
      Redundant computations in naive recursion vs. O(1) lookup with DP Memoization / Tabulation
    </text>
  </g>

  <!-- Left: Naive Recursive Tree -->
  <g transform="translate(30, 80)">
    <!-- Tree Container Box -->
    <rect width="510" height="375" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="1.5" />
    <text x="20" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f87171">
      ❌ Naive Recursion: O(2ⁿ) Exponential Calls
    </text>

    <!-- Connectors -->
    <!-- Root fib(5) to fib(4) and fib(3) -->
    <line x1="255" y1="65" x2="160" y2="120" stroke="#64748b" stroke-width="1.5" />
    <line x1="255" y1="65" x2="350" y2="120" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,3" />

    <!-- fib(4) to fib(3) and fib(2) -->
    <line x1="160" y1="140" x2="100" y2="190" stroke="#64748b" stroke-width="1.5" />
    <line x1="160" y1="140" x2="210" y2="190" stroke="#64748b" stroke-width="1.5" />

    <!-- fib(3) (right) to fib(2) and fib(1) -->
    <line x1="350" y1="140" x2="310" y2="190" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3" />
    <line x1="350" y1="140" x2="390" y2="190" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3" />

    <!-- fib(3) (left) to fib(2) and fib(1) -->
    <line x1="100" y1="210" x2="60" y2="260" stroke="#64748b" stroke-width="1.5" />
    <line x1="100" y1="210" x2="135" y2="260" stroke="#64748b" stroke-width="1.5" />

    <!-- fib(2) (left) to fib(1) and fib(0) -->
    <line x1="210" y1="210" x2="190" y2="260" stroke="#64748b" stroke-width="1.5" />
    <line x1="210" y1="210" x2="235" y2="260" stroke="#64748b" stroke-width="1.5" />

    <!-- Nodes -->
    <!-- Level 0: fib(5) -->
    <circle cx="255" cy="55" r="18" fill="url(#nodeBlue)" stroke="#60a5fa" stroke-width="1.5" />
    <text x="255" y="60" font-family="sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">f(5)</text>

    <!-- Level 1 -->
    <circle cx="160" cy="130" r="17" fill="url(#nodeBlue)" stroke="#60a5fa" stroke-width="1.5" />
    <text x="160" y="134" font-family="sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">f(4)</text>

    <!-- fib(3) duplicated (Red) -->
    <circle cx="350" cy="130" r="17" fill="url(#nodeRed)" stroke="#f87171" stroke-width="2" />
    <text x="350" y="134" font-family="sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">f(3)</text>
    <rect x="375" y="118" width="85" height="20" rx="4" fill="#991b1b" />
    <text x="417" y="132" font-family="sans-serif" font-size="9.5" fill="#fecaca" text-anchor="middle">RECOMPUTED!</text>

    <!-- Level 2 -->
    <circle cx="100" cy="200" r="16" fill="url(#nodeBlue)" stroke="#60a5fa" stroke-width="1.5" />
    <text x="100" y="204" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">f(3)</text>

    <circle cx="210" cy="200" r="16" fill="url(#nodeRed)" stroke="#f87171" stroke-width="1.5" />
    <text x="210" y="204" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">f(2)</text>

    <circle cx="310" cy="200" r="15" fill="url(#nodeRed)" stroke="#f87171" stroke-width="1.5" />
    <text x="310" y="204" font-family="sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">f(2)</text>

    <circle cx="390" cy="200" r="15" fill="#475569" stroke="#64748b" stroke-width="1" />
    <text x="390" y="204" font-family="sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">f(1)</text>

    <!-- Level 3 -->
    <circle cx="60" cy="270" r="14" fill="url(#nodeRed)" stroke="#f87171" stroke-width="1.2" />
    <text x="60" y="274" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#fff" text-anchor="middle">f(2)</text>

    <circle cx="135" cy="270" r="14" fill="#475569" />
    <text x="135" y="274" font-family="sans-serif" font-size="9.5" fill="#fff" text-anchor="middle">f(1)</text>

    <circle cx="190" cy="270" r="14" fill="#475569" />
    <text x="190" y="274" font-family="sans-serif" font-size="9.5" fill="#fff" text-anchor="middle">f(1)</text>

    <circle cx="235" cy="270" r="14" fill="#475569" />
    <text x="235" y="274" font-family="sans-serif" font-size="9.5" fill="#fff" text-anchor="middle">f(0)</text>

    <!-- Bottom summary banner -->
    <rect x="20" y="325" width="470" height="34" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
    <text x="255" y="346" font-family="sans-serif" font-size="11" fill="#c7d2fe" font-weight="600" text-anchor="middle">
      f(3) solved 2× | f(2) solved 3× | f(1) solved 5× → Wasteful!
    </text>
  </g>

  <!-- Right: Dynamic Programming Solution -->
  <g transform="translate(560, 80)">
    <rect width="250" height="375" rx="12" fill="#090d16" stroke="#059669" stroke-width="1.5" />
    <text x="15" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#34d399">
      ✓ Dynamic Programming: O(n)
    </text>
    <text x="15" y="48" font-family="system-ui, sans-serif" font-size="10.5" fill="#94a3b8">
      Store once in Table → Instant O(1) Lookup
    </text>

    <!-- DP Table Visual -->
    <g transform="translate(15, 68)">
      <text x="0" y="15" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1">DP Lookup Table:</text>

      <!-- Headers -->
      <rect x="0" y="26" width="36" height="24" fill="#1e293b" stroke="#334155" />
      <text x="18" y="42" font-family="mono, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">i</text>
      <rect x="36" y="26" width="36" height="24" fill="#1e293b" stroke="#334155" />
      <text x="54" y="42" font-family="mono, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">0</text>
      <rect x="72" y="26" width="36" height="24" fill="#1e293b" stroke="#334155" />
      <text x="90" y="42" font-family="mono, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">1</text>
      <rect x="108" y="26" width="36" height="24" fill="#1e293b" stroke="#334155" />
      <text x="126" y="42" font-family="mono, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">2</text>
      <rect x="144" y="26" width="36" height="24" fill="#1e293b" stroke="#334155" />
      <text x="162" y="42" font-family="mono, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">3</text>
      <rect x="180" y="26" width="36" height="24" fill="#1e293b" stroke="#334155" />
      <text x="198" y="42" font-family="mono, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">4</text>

      <!-- Values -->
      <rect x="0" y="50" width="36" height="24" fill="#1e293b" stroke="#334155" />
      <text x="18" y="66" font-family="mono, sans-serif" font-size="9.5" fill="#38bdf8" text-anchor="middle">dp[i]</text>
      <rect x="36" y="50" width="36" height="24" fill="#0f172a" stroke="#334155" />
      <text x="54" y="66" font-family="mono, sans-serif" font-size="10" fill="#f8fafc" text-anchor="middle">0</text>
      <rect x="72" y="50" width="36" height="24" fill="#0f172a" stroke="#334155" />
      <text x="90" y="66" font-family="mono, sans-serif" font-size="10" fill="#f8fafc" text-anchor="middle">1</text>
      <rect x="108" y="50" width="36" height="24" fill="#065f46" stroke="#10b981" />
      <text x="126" y="66" font-family="mono, sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">1</text>
      <rect x="144" y="50" width="36" height="24" fill="#065f46" stroke="#10b981" />
      <text x="162" y="66" font-family="mono, sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">2</text>
      <rect x="180" y="50" width="36" height="24" fill="#065f46" stroke="#10b981" />
      <text x="198" y="66" font-family="mono, sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">3</text>
    </g>

    <!-- DP Formula -->
    <g transform="translate(15, 175)">
      <rect width="220" height="60" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="15" y="24" font-family="sans-serif" font-size="10.5" fill="#94a3b8">Recurrence Relation:</text>
      <text x="15" y="46" font-family="mono, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">dp[i] = dp[i-1] + dp[i-2]</text>
    </g>

    <!-- Benefits Box -->
    <g transform="translate(15, 255)">
      <rect width="220" height="100" rx="8" fill="#064e3b" stroke="#059669" />
      <text x="12" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#a7f3d0">Core Advantages:</text>
      <text x="12" y="42" font-family="sans-serif" font-size="10" fill="#d1fae5">• Zero redundant work</text>
      <text x="12" y="60" font-family="sans-serif" font-size="10" fill="#d1fae5">• Time: O(n) linear</text>
      <text x="12" y="78" font-family="sans-serif" font-size="10" fill="#d1fae5">• Space: O(n) or O(1)</text>
    </g>
  </g>
</svg>
