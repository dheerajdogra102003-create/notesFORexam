<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="100%" height="100%">
  <defs>
    <linearGradient id="dijkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <marker id="dijkArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 10 5 L 0 8 z" fill="#10b981" />
    </marker>
    <marker id="edgeArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 10 5 L 0 8 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="480" rx="16" fill="url(#dijkBg)" stroke="#334155" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(36, 22)">
    <rect width="5" height="26" rx="2.5" fill="#10b981" />
    <text x="16" y="20" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">
      Dijkstra's Algorithm: Greedy Edge Relaxation &amp; Shortest Path
    </text>
    <text x="16" y="38" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
      Computes shortest paths from source vertex S in directed/undirected graphs with non-negative edge weights (w ≥ 0).
    </text>
  </g>

  <!-- Left: Weighted Graph -->
  <g transform="translate(36, 75)">
    <rect width="390" height="300" rx="12" fill="#131d31" stroke="#334155" />
    <text x="195" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">
      Graph with Shortest Paths Highlighted (Source = A)
    </text>

    <g transform="translate(40, 50)">
      <!-- Edges -->
      <!-- A to B (weight 4) -->
      <line x1="40" y1="90" x2="140" y2="30" stroke="#10b981" stroke-width="3" />
      <rect x="80" y="48" width="22" height="18" rx="4" fill="#064e3b" stroke="#10b981" />
      <text x="91" y="61" font-family="monospace" font-size="11" font-weight="700" fill="#a7f3d0" text-anchor="middle">4</text>

      <!-- A to C (weight 2) -->
      <line x1="40" y1="90" x2="140" y2="150" stroke="#10b981" stroke-width="3" />
      <rect x="80" y="112" width="22" height="18" rx="4" fill="#064e3b" stroke="#10b981" />
      <text x="91" y="125" font-family="monospace" font-size="11" font-weight="700" fill="#a7f3d0" text-anchor="middle">2</text>

      <!-- C to B (weight 1) RELAXATION EDGE! -->
      <line x1="140" y1="150" x2="140" y2="30" stroke="#10b981" stroke-width="3" stroke-dasharray="4 2" />
      <rect x="145" y="82" width="22" height="18" rx="4" fill="#064e3b" stroke="#10b981" />
      <text x="156" y="95" font-family="monospace" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">1</text>

      <!-- B to D (weight 5) -->
      <line x1="140" y1="30" x2="260" y2="90" stroke="#64748b" stroke-width="1.5" />
      <rect x="195" y="48" width="22" height="18" rx="4" fill="#1e293b" />
      <text x="206" y="61" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">5</text>

      <!-- C to D (weight 8) -->
      <line x1="140" y1="150" x2="260" y2="90" stroke="#64748b" stroke-width="1.5" />
      <rect x="195" y="112" width="22" height="18" rx="4" fill="#1e293b" />
      <text x="206" y="125" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">8</text>

      <!-- B to D alternative via E if exists, or direct -->
      <!-- Nodes -->
      <!-- Node A: Source -->
      <circle cx="40" cy="90" r="22" fill="#047857" stroke="#10b981" stroke-width="2.5" />
      <text x="40" y="94" font-family="sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">A</text>
      <text x="40" y="125" font-family="monospace" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">d=0</text>

      <!-- Node B -->
      <circle cx="140" cy="30" r="20" fill="#1e293b" stroke="#10b981" stroke-width="2" />
      <text x="140" y="34" font-family="sans-serif" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">B</text>
      <text x="140" y="5" font-family="monospace" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">d=3 (via C)</text>

      <!-- Node C -->
      <circle cx="140" cy="150" r="20" fill="#1e293b" stroke="#10b981" stroke-width="2" />
      <text x="140" y="154" font-family="sans-serif" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">C</text>
      <text x="140" y="185" font-family="monospace" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">d=2</text>

      <!-- Node D -->
      <circle cx="260" cy="90" r="20" fill="#1e293b" stroke="#64748b" stroke-width="2" />
      <text x="260" y="94" font-family="sans-serif" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">D</text>
      <text x="260" y="125" font-family="monospace" font-size="11" font-weight="700" fill="#cbd5e1" text-anchor="middle">d=8 (3+5)</text>
    </g>

    <!-- Edge relaxation formula tag -->
    <rect x="20" y="248" width="350" height="38" rx="6" fill="#0f172a" stroke="#10b981" stroke-dasharray="3 3" />
    <text x="195" y="271" font-family="monospace" font-size="12" font-weight="700" fill="#a7f3d0" text-anchor="middle">
      Relaxation: dist[v] = min(dist[v], dist[u] + w(u,v))
    </text>
  </g>

  <!-- Right: Priority Queue / State Table -->
  <g transform="translate(445, 75)">
    <rect width="380" height="300" rx="12" fill="#131d31" stroke="#334155" />
    <text x="190" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">
      Relaxation Execution Trace Table
    </text>

    <!-- Table header -->
    <g transform="translate(15, 45)">
      <rect width="350" height="26" rx="4" fill="#1e293b" />
      <text x="15" y="17" font-family="sans-serif" font-size="11" font-weight="700" fill="#94a3b8">Iteration</text>
      <text x="85" y="17" font-family="sans-serif" font-size="11" font-weight="700" fill="#94a3b8">Min Extracted</text>
      <text x="180" y="17" font-family="sans-serif" font-size="11" font-weight="700" fill="#94a3b8">Relaxed Distances</text>
      <text x="300" y="17" font-family="sans-serif" font-size="11" font-weight="700" fill="#10b981">Final dist[]</text>

      <!-- Row 1 -->
      <g transform="translate(0, 32)">
        <text x="15" y="16" font-family="sans-serif" font-size="11" fill="#cbd5e1">Init</text>
        <text x="85" y="16" font-family="monospace" font-size="11" fill="#cbd5e1">-</text>
        <text x="180" y="16" font-family="monospace" font-size="11" fill="#cbd5e1">A:0, B:∞, C:∞, D:∞</text>
        <text x="300" y="16" font-family="monospace" font-size="11" fill="#94a3b8">{A:0}</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 58)">
        <text x="15" y="16" font-family="sans-serif" font-size="11" fill="#cbd5e1">Iter 1</text>
        <text x="85" y="16" font-family="monospace" font-size="11" fill="#34d399" font-weight="700">A (d=0)</text>
        <text x="180" y="16" font-family="monospace" font-size="11" fill="#cbd5e1">B: 4, C: 2</text>
        <text x="300" y="16" font-family="monospace" font-size="11" fill="#34d399">dist[A]=0</text>
      </g>

      <!-- Row 3 -->
      <g transform="translate(0, 84)">
        <text x="15" y="16" font-family="sans-serif" font-size="11" fill="#cbd5e1">Iter 2</text>
        <text x="85" y="16" font-family="monospace" font-size="11" fill="#34d399" font-weight="700">C (d=2)</text>
        <text x="180" y="16" font-family="monospace" font-size="11" fill="#38bdf8" font-weight="600">B: 2+1=3 &lt; 4 !</text>
        <text x="300" y="16" font-family="monospace" font-size="11" fill="#34d399">dist[C]=2</text>
      </g>

      <!-- Row 4 -->
      <g transform="translate(0, 110)">
        <text x="15" y="16" font-family="sans-serif" font-size="11" fill="#cbd5e1">Iter 3</text>
        <text x="85" y="16" font-family="monospace" font-size="11" fill="#34d399" font-weight="700">B (d=3)</text>
        <text x="180" y="16" font-family="monospace" font-size="11" fill="#cbd5e1">D: 3+5=8</text>
        <text x="300" y="16" font-family="monospace" font-size="11" fill="#34d399">dist[B]=3</text>
      </g>

      <!-- Row 5 -->
      <g transform="translate(0, 136)">
        <text x="15" y="16" font-family="sans-serif" font-size="11" fill="#cbd5e1">Iter 4</text>
        <text x="85" y="16" font-family="monospace" font-size="11" fill="#34d399" font-weight="700">D (d=8)</text>
        <text x="180" y="16" font-family="monospace" font-size="11" fill="#cbd5e1">- (all visited)</text>
        <text x="300" y="16" font-family="monospace" font-size="11" fill="#34d399">dist[D]=8</text>
      </g>
    </g>

    <!-- Important note -->
    <rect x="15" y="235" width="350" height="50" rx="6" fill="#064e3b" stroke="#10b981" />
    <text x="25" y="253" font-family="sans-serif" font-size="11" font-weight="700" fill="#a7f3d0">Crucial Exam Property:</text>
    <text x="25" y="271" font-family="sans-serif" font-size="11" fill="#ecfdf5">
      Fails on negative weights! Use Bellman-Ford O(V·E) for negative edges.
    </text>
  </g>

  <!-- Bottom Complexity Bar -->
  <g transform="translate(36, 390)">
    <rect width="788" height="75" rx="8" fill="#0f172a" stroke="#334155" />
    <g transform="translate(20, 16)">
      <text x="0" y="15" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#10b981">Time &amp; Space Complexity Summary:</text>
      <text x="0" y="38" font-family="sans-serif" font-size="11" fill="#cbd5e1">• <tspan font-weight="700" fill="#f8fafc">Min-Heap / Priority Queue:</tspan> O((V + E) log V) — standard for sparse graphs.</text>
      <text x="460" y="38" font-family="sans-serif" font-size="11" fill="#cbd5e1">• <tspan font-weight="700" fill="#f8fafc">Unsorted Array:</tspan> O(V²) — optimal for dense graphs.</text>
    </g>
  </g>
</svg>
