<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="100%" height="100%">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Background card -->
  <rect x="0" y="0" width="760" height="270" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Title -->
  <text x="380" y="34" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">
    Visualizing Cellpadding vs Cellspacing
  </text>

  <!-- CELL 1 (Outer border) -->
  <rect x="50" y="70" width="280" height="150" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2.5" />
  <text x="65" y="94" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Cell 1 Border</text>

  <!-- Cell 1 Inner Content Box -->
  <rect x="110" y="110" width="160" height="70" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="4 3" />
  <text x="190" y="150" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="600" fill="#1e3a8a" text-anchor="middle">CONTENT</text>

  <!-- Cellpadding Arrows & Label -->
  <!-- Left padding arrow -->
  <line x1="55" y1="145" x2="105" y2="145" stroke="#2563eb" stroke-width="2" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)" />
  <!-- Bottom label for Cellpadding -->
  <rect x="65" y="195" width="250" height="42" rx="6" fill="#dbeafe" />
  <text x="190" y="213" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">
    cellpadding
  </text>
  <text x="190" y="229" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#3b82f6" text-anchor="middle">
    Space INSIDE cell around content
  </text>

  <!-- CELLSPACING (Gap between Cell 1 and Cell 2) -->
  <line x1="335" y1="145" x2="425" y2="145" stroke="#dc2626" stroke-width="2.5" marker-start="url(#arrow-red)" marker-end="url(#arrow-red)" />
  <rect x="335" y="85" width="90" height="48" rx="6" fill="#fee2e2" />
  <text x="380" y="105" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">
    cellspacing
  </text>
  <text x="380" y="122" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="500" fill="#b91c1c" text-anchor="middle">
    Space BETWEEN
  </text>

  <!-- CELL 2 (Outer border) -->
  <rect x="430" y="70" width="280" height="150" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2.5" />
  <text x="445" y="94" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Cell 2 Border</text>

  <!-- Cell 2 Inner Content Box -->
  <rect x="490" y="110" width="160" height="70" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="4 3" />
  <text x="570" y="150" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="600" fill="#1e3a8a" text-anchor="middle">CONTENT</text>

  <!-- Right padding arrow in Cell 2 -->
  <line x1="655" y1="145" x2="705" y2="145" stroke="#2563eb" stroke-width="2" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)" />
  <rect x="445" y="195" width="250" height="42" rx="6" fill="#dbeafe" />
  <text x="570" y="213" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">
    cellpadding
  </text>
  <text x="570" y="229" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#3b82f6" text-anchor="middle">
    Space INSIDE cell around content
  </text>
</svg>
