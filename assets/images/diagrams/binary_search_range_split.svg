<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <marker id="bsArrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 10 5 L 0 8 z" fill="#06b6d4" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="840" height="480" rx="16" fill="url(#bsBg)" stroke="#334155" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(36, 22)">
    <rect width="5" height="26" rx="2.5" fill="#06b6d4" />
    <text x="16" y="20" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">
      Binary Search: Divide &amp; Conquer Range Halving Trace
    </text>
    <text x="16" y="38" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
      Sorted Array [10, 20, 30, 40, 50, 60, 70] | Target Key = 60 | Halves search space each comparison: O(log n)
    </text>
  </g>

  <!-- Step 1: Initial State -->
  <g transform="translate(40, 75)">
    <!-- Stage Label -->
    <rect width="115" height="60" rx="8" fill="#131d31" stroke="#06b6d4" />
    <text x="57" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#06b6d4" text-anchor="middle">Step 1</text>
    <text x="57" y="40" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">low=0, high=6</text>
    <text x="57" y="52" font-family="monospace" font-size="11" fill="#38bdf8" text-anchor="middle">mid=3 (val=40)</text>

    <!-- Array Row -->
    <g transform="translate(135, 0)">
      <!-- 0: 10 (low) -->
      <g transform="translate(0, 0)">
        <text x="35" y="-6" font-family="sans-serif" font-size="10" font-weight="700" fill="#06b6d4" text-anchor="middle">LOW (0)</text>
        <rect width="70" height="52" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="2" />
        <text x="35" y="32" font-family="monospace" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle">10</text>
      </g>
      <!-- 1: 20 -->
      <g transform="translate(76, 0)">
        <rect width="70" height="52" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="35" y="32" font-family="monospace" font-size="16" font-weight="600" fill="#94a3b8" text-anchor="middle">20</text>
      </g>
      <!-- 2: 30 -->
      <g transform="translate(152, 0)">
        <rect width="70" height="52" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="35" y="32" font-family="monospace" font-size="16" font-weight="600" fill="#94a3b8" text-anchor="middle">30</text>
      </g>
      <!-- 3: 40 (mid) -->
      <g transform="translate(228, 0)">
        <text x="35" y="-6" font-family="sans-serif" font-size="10" font-weight="700" fill="#f59e0b" text-anchor="middle">MID (3)</text>
        <rect width="70" height="52" rx="6" fill="#451a03" stroke="#f59e0b" stroke-width="2.5" />
        <text x="35" y="32" font-family="monospace" font-size="17" font-weight="800" fill="#fef3c7" text-anchor="middle">40</text>
      </g>
      <!-- 4: 50 -->
      <g transform="translate(304, 0)">
        <rect width="70" height="52" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="35" y="32" font-family="monospace" font-size="16" font-weight="600" fill="#94a3b8" text-anchor="middle">50</text>
      </g>
      <!-- 5: 60 -->
      <g transform="translate(380, 0)">
        <rect width="70" height="52" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="35" y="32" font-family="monospace" font-size="16" font-weight="600" fill="#94a3b8" text-anchor="middle">60</text>
      </g>
      <!-- 6: 70 (high) -->
      <g transform="translate(456, 0)">
        <text x="35" y="-6" font-family="sans-serif" font-size="10" font-weight="700" fill="#06b6d4" text-anchor="middle">HIGH (6)</text>
        <rect width="70" height="52" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="2" />
        <text x="35" y="32" font-family="monospace" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle">70</text>
      </g>
    </g>

    <!-- Comparison note -->
    <text x="685" y="32" font-family="sans-serif" font-size="12" font-weight="600" fill="#f59e0b">
      40 &lt; 60
    </text>
    <text x="685" y="48" font-family="sans-serif" font-size="11" fill="#94a3b8">
      Discard left half [0..3]
    </text>
  </g>

  <!-- Transition Arrow -->
  <g transform="translate(380, 160)">
    <line x1="0" y1="0" x2="0" y2="24" stroke="#06b6d4" stroke-width="2" marker-end="url(#bsArrow)" />
    <text x="15" y="16" font-family="sans-serif" font-size="11" fill="#38bdf8">low = mid + 1 = 4</text>
  </g>

  <!-- Step 2: Reduced Search Space -->
  <g transform="translate(40, 205)">
    <!-- Stage Label -->
    <rect width="115" height="60" rx="8" fill="#131d31" stroke="#10b981" />
    <text x="57" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#10b981" text-anchor="middle">Step 2</text>
    <text x="57" y="40" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">low=4, high=6</text>
    <text x="57" y="52" font-family="monospace" font-size="11" fill="#10b981" text-anchor="middle">mid=5 (val=60)</text>

    <!-- Array Row with greyed out left half -->
    <g transform="translate(135, 0)">
      <!-- 0: 10 (ELIMINATED) -->
      <g transform="translate(0, 0)">
        <rect width="70" height="52" rx="6" fill="#0f172a" stroke="#1e293b" opacity="0.4" />
        <text x="35" y="32" font-family="monospace" font-size="15" fill="#475569" text-anchor="middle" text-decoration="line-through">10</text>
      </g>
      <!-- 1: 20 (ELIMINATED) -->
      <g transform="translate(76, 0)">
        <rect width="70" height="52" rx="6" fill="#0f172a" stroke="#1e293b" opacity="0.4" />
        <text x="35" y="32" font-family="monospace" font-size="15" fill="#475569" text-anchor="middle" text-decoration="line-through">20</text>
      </g>
      <!-- 2: 30 (ELIMINATED) -->
      <g transform="translate(152, 0)">
        <rect width="70" height="52" rx="6" fill="#0f172a" stroke="#1e293b" opacity="0.4" />
        <text x="35" y="32" font-family="monospace" font-size="15" fill="#475569" text-anchor="middle" text-decoration="line-through">30</text>
      </g>
      <!-- 3: 40 (ELIMINATED) -->
      <g transform="translate(228, 0)">
        <rect width="70" height="52" rx="6" fill="#0f172a" stroke="#1e293b" opacity="0.4" />
        <text x="35" y="32" font-family="monospace" font-size="15" fill="#475569" text-anchor="middle" text-decoration="line-through">40</text>
      </g>

      <!-- 4: 50 (low) -->
      <g transform="translate(304, 0)">
        <text x="35" y="-6" font-family="sans-serif" font-size="10" font-weight="700" fill="#06b6d4" text-anchor="middle">LOW (4)</text>
        <rect width="70" height="52" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="2" />
        <text x="35" y="32" font-family="monospace" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle">50</text>
      </g>

      <!-- 5: 60 (mid) FOUND! -->
      <g transform="translate(380, 0)">
        <text x="35" y="-6" font-family="sans-serif" font-size="10" font-weight="700" fill="#10b981" text-anchor="middle">MID (5) MATCH!</text>
        <rect width="70" height="52" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="3" />
        <text x="35" y="32" font-family="monospace" font-size="18" font-weight="800" fill="#ecfdf5" text-anchor="middle">60</text>
      </g>

      <!-- 6: 70 (high) -->
      <g transform="translate(456, 0)">
        <text x="35" y="-6" font-family="sans-serif" font-size="10" font-weight="700" fill="#06b6d4" text-anchor="middle">HIGH (6)</text>
        <rect width="70" height="52" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="2" />
        <text x="35" y="32" font-family="monospace" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle">70</text>
      </g>
    </g>

    <!-- Success check -->
    <text x="685" y="32" font-family="sans-serif" font-size="13" font-weight="700" fill="#10b981">
      60 == 60 ✓
    </text>
    <text x="685" y="48" font-family="sans-serif" font-size="11" fill="#a7f3d0">
      Found at index 5!
    </text>
  </g>

  <!-- Bottom Comparison Card -->
  <g transform="translate(40, 290)">
    <rect width="760" height="165" rx="10" fill="#0f172a" stroke="#334155" />
    <g transform="translate(25, 20)">
      <text x="0" y="16" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#06b6d4">Why Binary Search Beats Linear Search (Exam Comparison):</text>
      
      <!-- Comparison Table inside SVG -->
      <g transform="translate(0, 32)">
        <rect width="710" height="26" fill="#1e293b" rx="4" />
        <text x="12" y="17" font-family="sans-serif" font-size="11" font-weight="700" fill="#94a3b8">FEATURE</text>
        <text x="210" y="17" font-family="sans-serif" font-size="11" font-weight="700" fill="#f59e0b">LINEAR SEARCH</text>
        <text x="450" y="17" font-family="sans-serif" font-size="11" font-weight="700" fill="#10b981">BINARY SEARCH</text>

        <!-- Row 1 -->
        <text x="12" y="42" font-family="sans-serif" font-size="11" fill="#cbd5e1">Worst-Case Time</text>
        <text x="210" y="42" font-family="monospace" font-size="11" fill="#fca5a5" font-weight="700">O(n)</text>
        <text x="450" y="42" font-family="monospace" font-size="11" fill="#86efac" font-weight="700">O(log₂ n)</text>

        <!-- Row 2 -->
        <text x="12" y="64" font-family="sans-serif" font-size="11" fill="#cbd5e1">For N = 1,000,000</text>
        <text x="210" y="64" font-family="sans-serif" font-size="11" fill="#fca5a5">Up to 1,000,000 comparisons</text>
        <text x="450" y="64" font-family="sans-serif" font-size="11" fill="#86efac" font-weight="700">At most ~20 comparisons!</text>

        <!-- Row 3 -->
        <text x="12" y="86" font-family="sans-serif" font-size="11" fill="#cbd5e1">Array Requirement</text>
        <text x="210" y="86" font-family="sans-serif" font-size="11" fill="#94a3b8">Any array (unsorted or sorted)</text>
        <text x="450" y="86" font-family="sans-serif" font-size="11" fill="#38bdf8" font-weight="600">Must be strictly SORTED</text>
      </g>
    </g>
  </g>
</svg>
