<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="100%" height="100%">
  <defs>
    <linearGradient id="backBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="860" height="480" rx="16" fill="url(#backBg)" stroke="#334155" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(36, 24)">
    <rect width="5" height="26" rx="2.5" fill="#f59e0b" />
    <text x="16" y="20" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">
      Backtracking: 4-Queens State-Space Search Tree &amp; Pruning
    </text>
    <text x="16" y="38" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
      Depth-First search with bounding functions: prune branches immediately when queens attack (same row, col, or diagonal).
    </text>
  </g>

  <!-- Left: State-Space Tree -->
  <g transform="translate(36, 75)">
    <rect width="480" height="380" rx="12" fill="#131d31" stroke="#334155" />
    <text x="240" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f59e0b" text-anchor="middle">
      State-Space Tree with Pruned Dead Ends (❌)
    </text>

    <!-- Root Node -->
    <circle cx="240" cy="55" r="16" fill="#334155" stroke="#94a3b8" />
    <text x="240" y="59" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Root</text>
    <text x="270" y="58" font-family="sans-serif" font-size="10" fill="#64748b">Row 0</text>

    <!-- Row 1 Branches (Try Col 1, Col 2) -->
    <!-- Branch to Q1 = Col 1 -->
    <line x1="240" y1="55" x2="100" y2="115" stroke="#ef4444" stroke-width="1.5" />
    <circle cx="100" cy="115" r="15" fill="#1e293b" stroke="#ef4444" />
    <text x="100" y="119" font-family="monospace" font-size="11" fill="#fca5a5" text-anchor="middle">(1,1)</text>

    <!-- Sub-branches under (1,1) all fail -->
    <line x1="100" y1="115" x2="60" y2="165" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="2 2" />
    <circle cx="60" cy="165" r="12" fill="#450a0a" stroke="#ef4444" />
    <text x="60" y="169" font-family="sans-serif" font-size="10" font-weight="700" fill="#ef4444" text-anchor="middle">❌</text>
    <text x="60" y="188" font-family="sans-serif" font-size="9" fill="#fca5a5" text-anchor="middle">Col 2 (diag)</text>

    <line x1="100" y1="115" x2="140" y2="165" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="2 2" />
    <circle cx="140" cy="165" r="12" fill="#450a0a" stroke="#ef4444" />
    <text x="140" y="169" font-family="sans-serif" font-size="10" font-weight="700" fill="#ef4444" text-anchor="middle">❌</text>
    <text x="140" y="188" font-family="sans-serif" font-size="9" fill="#fca5a5" text-anchor="middle">Dead End</text>

    <!-- Branch to Q1 = Col 2 (Leads to Solution!) -->
    <line x1="240" y1="55" x2="330" y2="115" stroke="#10b981" stroke-width="2.5" />
    <circle cx="330" cy="115" r="16" fill="#064e3b" stroke="#10b981" stroke-width="2" />
    <text x="330" y="119" font-family="monospace" font-size="11" font-weight="700" fill="#a7f3d0" text-anchor="middle">(1,2)</text>
    <text x="360" y="118" font-family="sans-serif" font-size="10" fill="#34d399">Row 1: Col 2 ✓</text>

    <!-- Row 2 under (1,2): try cols 1..4 -->
    <!-- Col 1,2,3 clash -->
    <line x1="330" y1="115" x2="260" y2="185" stroke="#ef4444" stroke-dasharray="2 2" />
    <circle cx="260" cy="185" r="12" fill="#450a0a" stroke="#ef4444" />
    <text x="260" y="189" font-family="sans-serif" font-size="10" fill="#ef4444" text-anchor="middle">❌</text>
    <text x="260" y="208" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Cols 1,2,3 attack</text>

    <!-- Col 4 safe! -->
    <line x1="330" y1="115" x2="380" y2="185" stroke="#10b981" stroke-width="2.5" />
    <circle cx="380" cy="185" r="16" fill="#064e3b" stroke="#10b981" stroke-width="2" />
    <text x="380" y="189" font-family="monospace" font-size="11" font-weight="700" fill="#a7f3d0" text-anchor="middle">(2,4)</text>
    <text x="415" y="188" font-family="sans-serif" font-size="10" fill="#34d399">Row 2: Col 4 ✓</text>

    <!-- Row 3 under (2,4): Col 1 is safe! -->
    <line x1="380" y1="185" x2="330" y2="255" stroke="#10b981" stroke-width="2.5" />
    <circle cx="330" cy="255" r="16" fill="#064e3b" stroke="#10b981" stroke-width="2" />
    <text x="330" y="259" font-family="monospace" font-size="11" font-weight="700" fill="#a7f3d0" text-anchor="middle">(3,1)</text>
    <text x="285" y="258" font-family="sans-serif" font-size="10" fill="#34d399">Row 3: Col 1 ✓</text>

    <!-- Row 4 under (3,1): Col 3 is safe! -->
    <line x1="330" y1="255" x2="380" y2="325" stroke="#10b981" stroke-width="2.5" />
    <circle cx="380" cy="325" r="18" fill="#047857" stroke="#34d399" stroke-width="2.5" />
    <text x="380" y="329" font-family="monospace" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">(4,3)</text>
    <text x="435" y="328" font-family="sans-serif" font-size="11" font-weight="700" fill="#34d399">Row 4: Col 3 ✓</text>

    <!-- Solution Banner -->
    <rect x="25" y="335" width="280" height="32" rx="6" fill="#064e3b" stroke="#10b981" />
    <text x="165" y="356" font-family="sans-serif" font-size="12" font-weight="700" fill="#ecfdf5" text-anchor="middle">
      ✓ Solution Tuple: [2, 4, 1, 3] Found!
    </text>
  </g>

  <!-- Right: 4x4 Chessboard Placement Visual -->
  <g transform="translate(535, 75)">
    <rect width="290" height="380" rx="12" fill="#131d31" stroke="#334155" />
    <text x="145" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">
      Safe 4x4 Chessboard Configuration
    </text>

    <!-- Chessboard 4x4 -->
    <g transform="translate(35, 45)">
      <!-- Board Border -->
      <rect width="220" height="220" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="2" />

      <!-- Row 1 (y=0..55) -->
      <!-- (1,1): empty -->
      <rect x="0" y="0" width="55" height="55" fill="#334155" />
      <!-- (1,2): QUEEN -->
      <rect x="55" y="0" width="55" height="55" fill="#064e3b" stroke="#10b981" stroke-width="2" />
      <text x="82" y="36" font-family="sans-serif" font-size="26" text-anchor="middle">👑</text>
      <!-- (1,3): empty -->
      <rect x="110" y="0" width="55" height="55" fill="#334155" />
      <!-- (1,4): empty -->
      <rect x="165" y="0" width="55" height="55" fill="#1e293b" />

      <!-- Row 2 (y=55..110) -->
      <rect x="0" y="55" width="55" height="55" fill="#1e293b" />
      <rect x="55" y="55" width="55" height="55" fill="#334155" />
      <rect x="110" y="55" width="55" height="55" fill="#1e293b" />
      <!-- (2,4): QUEEN -->
      <rect x="165" y="55" width="55" height="55" fill="#064e3b" stroke="#10b981" stroke-width="2" />
      <text x="192" y="91" font-family="sans-serif" font-size="26" text-anchor="middle">👑</text>

      <!-- Row 3 (y=110..165) -->
      <!-- (3,1): QUEEN -->
      <rect x="0" y="110" width="55" height="55" fill="#064e3b" stroke="#10b981" stroke-width="2" />
      <text x="27" y="146" font-family="sans-serif" font-size="26" text-anchor="middle">👑</text>
      <rect x="55" y="110" width="55" height="55" fill="#1e293b" />
      <rect x="110" y="110" width="55" height="55" fill="#334155" />
      <rect x="165" y="110" width="55" height="55" fill="#1e293b" />

      <!-- Row 4 (y=165..220) -->
      <rect x="0" y="165" width="55" height="55" fill="#1e293b" />
      <rect x="55" y="165" width="55" height="55" fill="#334155" />
      <!-- (4,3): QUEEN -->
      <rect x="110" y="165" width="55" height="55" fill="#064e3b" stroke="#10b981" stroke-width="2" />
      <text x="137" y="201" font-family="sans-serif" font-size="26" text-anchor="middle">👑</text>
      <rect x="165" y="165" width="55" height="55" fill="#334155" />
    </g>

    <!-- Diagonal Clash Bounding Check Note -->
    <g transform="translate(15, 280)">
      <rect width="260" height="85" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="12" y="20" font-family="sans-serif" font-size="11" font-weight="700" fill="#f59e0b">Bounding Condition (Check):</text>
      <text x="12" y="38" font-family="monospace" font-size="11" fill="#cbd5e1">|col[i] - col[k]| == |i - k|</text>
      <text x="12" y="54" font-family="sans-serif" font-size="10" fill="#94a3b8">If true → Queens clash diagonally!</text>
      <text x="12" y="70" font-family="sans-serif" font-size="10" fill="#34d399">Backtracking skips remaining row nodes.</text>
    </g>
  </g>
</svg>
