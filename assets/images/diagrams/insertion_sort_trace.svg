<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <marker id="shiftArrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 10 5 L 0 8 z" fill="#f59e0b" />
    </marker>
    <marker id="insertArrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 10 5 L 0 8 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="460" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(36, 26)">
    <rect width="5" height="26" rx="2.5" fill="#6366f1" />
    <text x="16" y="20" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">
      Insertion Sort: Step-by-Step Execution Trace
    </text>
    <text x="16" y="38" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
      Key element is picked and shifted into its sorted position (Card Player Analogy)
    </text>
  </g>

  <!-- Pass rows container -->
  <g transform="translate(40, 75)">

    <!-- Row 0: Initial Array -->
    <g transform="translate(0, 0)">
      <rect width="110" height="46" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="55" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="middle">Initial</text>
      
      <!-- Array cells -->
      <g transform="translate(130, 0)">
        <rect x="0" y="0" width="56" height="46" rx="6" fill="#334155" stroke="#475569" />
        <text x="28" y="28" font-family="mono, sans-serif" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">12</text>

        <rect x="64" y="0" width="56" height="46" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="92" y="28" font-family="mono, sans-serif" font-size="15" font-weight="600" fill="#94a3b8" text-anchor="middle">11</text>

        <rect x="128" y="0" width="56" height="46" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="156" y="28" font-family="mono, sans-serif" font-size="15" font-weight="600" fill="#94a3b8" text-anchor="middle">13</text>

        <rect x="192" y="0" width="56" height="46" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="220" y="28" font-family="mono, sans-serif" font-size="15" font-weight="600" fill="#94a3b8" text-anchor="middle">5</text>

        <rect x="256" y="0" width="56" height="46" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="284" y="28" font-family="mono, sans-serif" font-size="15" font-weight="600" fill="#94a3b8" text-anchor="middle">6</text>
      </g>
      <text x="470" y="28" font-family="sans-serif" font-size="12" fill="#64748b">First element [12] is trivially sorted</text>
    </g>

    <!-- Pass 1: Key = 11 -->
    <g transform="translate(0, 60)">
      <rect width="110" height="46" rx="6" fill="#1e293b" stroke="#6366f1" />
      <text x="55" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#818cf8" text-anchor="middle">Pass 1: Key 11</text>
      
      <g transform="translate(130, 0)">
        <rect x="0" y="0" width="56" height="46" rx="6" fill="#065f46" stroke="#10b981" />
        <text x="28" y="28" font-family="mono, sans-serif" font-size="15" font-weight="800" fill="#34d399" text-anchor="middle">11</text>

        <rect x="64" y="0" width="56" height="46" rx="6" fill="#065f46" stroke="#10b981" />
        <text x="92" y="28" font-family="mono, sans-serif" font-size="15" font-weight="700" fill="#34d399" text-anchor="middle">12</text>

        <rect x="128" y="0" width="56" height="46" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="156" y="28" font-family="mono, sans-serif" font-size="15" font-weight="600" fill="#94a3b8" text-anchor="middle">13</text>

        <rect x="192" y="0" width="56" height="46" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="220" y="28" font-family="mono, sans-serif" font-size="15" font-weight="600" fill="#94a3b8" text-anchor="middle">5</text>

        <rect x="256" y="0" width="56" height="46" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="284" y="28" font-family="mono, sans-serif" font-size="15" font-weight="600" fill="#94a3b8" text-anchor="middle">6</text>
      </g>
      <text x="470" y="28" font-family="sans-serif" font-size="12" fill="#38bdf8">12 &gt; 11 → 12 shifts right, 11 inserted at idx 0</text>
    </g>

    <!-- Pass 2: Key = 13 -->
    <g transform="translate(0, 120)">
      <rect width="110" height="46" rx="6" fill="#1e293b" stroke="#6366f1" />
      <text x="55" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#818cf8" text-anchor="middle">Pass 2: Key 13</text>
      
      <g transform="translate(130, 0)">
        <rect x="0" y="0" width="56" height="46" rx="6" fill="#065f46" stroke="#10b981" />
        <text x="28" y="28" font-family="mono, sans-serif" font-size="15" font-weight="700" fill="#34d399" text-anchor="middle">11</text>

        <rect x="64" y="0" width="56" height="46" rx="6" fill="#065f46" stroke="#10b981" />
        <text x="92" y="28" font-family="mono, sans-serif" font-size="15" font-weight="700" fill="#34d399" text-anchor="middle">12</text>

        <rect x="128" y="0" width="56" height="46" rx="6" fill="#065f46" stroke="#10b981" />
        <text x="156" y="28" font-family="mono, sans-serif" font-size="15" font-weight="800" fill="#34d399" text-anchor="middle">13</text>

        <rect x="192" y="0" width="56" height="46" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="220" y="28" font-family="mono, sans-serif" font-size="15" font-weight="600" fill="#94a3b8" text-anchor="middle">5</text>

        <rect x="256" y="0" width="56" height="46" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="284" y="28" font-family="mono, sans-serif" font-size="15" font-weight="600" fill="#94a3b8" text-anchor="middle">6</text>
      </g>
      <text x="470" y="28" font-family="sans-serif" font-size="12" fill="#94a3b8">12 &lt; 13 → No shift needed; stays in place</text>
    </g>

    <!-- Pass 3: Key = 5 -->
    <g transform="translate(0, 180)">
      <rect width="110" height="46" rx="6" fill="#1e293b" stroke="#6366f1" />
      <text x="55" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#818cf8" text-anchor="middle">Pass 3: Key 5</text>
      
      <g transform="translate(130, 0)">
        <rect x="0" y="0" width="56" height="46" rx="6" fill="#065f46" stroke="#10b981" />
        <text x="28" y="28" font-family="mono, sans-serif" font-size="15" font-weight="800" fill="#34d399" text-anchor="middle">5</text>

        <rect x="64" y="0" width="56" height="46" rx="6" fill="#065f46" stroke="#10b981" />
        <text x="92" y="28" font-family="mono, sans-serif" font-size="15" font-weight="700" fill="#34d399" text-anchor="middle">11</text>

        <rect x="128" y="0" width="56" height="46" rx="6" fill="#065f46" stroke="#10b981" />
        <text x="156" y="28" font-family="mono, sans-serif" font-size="15" font-weight="700" fill="#34d399" text-anchor="middle">12</text>

        <rect x="192" y="0" width="56" height="46" rx="6" fill="#065f46" stroke="#10b981" />
        <text x="220" y="28" font-family="mono, sans-serif" font-size="15" font-weight="700" fill="#34d399" text-anchor="middle">13</text>

        <rect x="256" y="0" width="56" height="46" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="284" y="28" font-family="mono, sans-serif" font-size="15" font-weight="600" fill="#94a3b8" text-anchor="middle">6</text>
      </g>
      <text x="470" y="28" font-family="sans-serif" font-size="12" fill="#38bdf8">13, 12, 11 shift right → 5 inserted at idx 0</text>
    </g>

    <!-- Pass 4: Key = 6 -->
    <g transform="translate(0, 240)">
      <rect width="110" height="46" rx="6" fill="#1e293b" stroke="#10b981" />
      <text x="55" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">Pass 4: Key 6</text>
      
      <g transform="translate(130, 0)">
        <rect x="0" y="0" width="56" height="46" rx="6" fill="#047857" stroke="#34d399" stroke-width="2" />
        <text x="28" y="28" font-family="mono, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">5</text>

        <rect x="64" y="0" width="56" height="46" rx="6" fill="#047857" stroke="#34d399" stroke-width="2" />
        <text x="92" y="28" font-family="mono, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">6</text>

        <rect x="128" y="0" width="56" height="46" rx="6" fill="#047857" stroke="#34d399" stroke-width="2" />
        <text x="156" y="28" font-family="mono, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">11</text>

        <rect x="192" y="0" width="56" height="46" rx="6" fill="#047857" stroke="#34d399" stroke-width="2" />
        <text x="220" y="28" font-family="mono, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">12</text>

        <rect x="256" y="0" width="56" height="46" rx="6" fill="#047857" stroke="#34d399" stroke-width="2" />
        <text x="284" y="28" font-family="mono, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">13</text>
      </g>
      <text x="470" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#34d399">✓ Array Completely Sorted!</text>
    </g>

    <!-- Bottom Properties Banner -->
    <g transform="translate(0, 310)">
      <rect width="740" height="46" rx="8" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1" />
      <text x="20" y="28" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#c7d2fe">
        Insertion Sort Properties: Best: O(n) | Worst/Avg: O(n²) | Space: O(1) Auxiliary | Stable: ✅ | In-Place: ✅
      </text>
    </g>
  </g>
</svg>
