<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" width="100%" height="100%">
  <defs>
    <linearGradient id="heapBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <marker id="heapArrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 10 5 L 0 8 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="840" height="480" rx="16" fill="url(#heapBg)" stroke="#334155" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(36, 24)">
    <rect width="5" height="26" rx="2.5" fill="#38bdf8" />
    <text x="16" y="20" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">
      Heap Sort: Binary Max-Heap Tree &amp; Array Representation
    </text>
    <text x="16" y="38" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
      Complete binary tree satisfying Max-Heap Property: Parent ≥ Children. Array mapping: Left = 2i + 1, Right = 2i + 2.
    </text>
  </g>

  <!-- Left: Binary Tree Visualization -->
  <g transform="translate(40, 85)">
    <rect width="360" height="360" rx="12" fill="#131d31" stroke="#334155" />
    <text x="180" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">
      Binary Max-Heap Tree Structure
    </text>

    <!-- Tree Edges -->
    <line x1="180" y1="80" x2="100" y2="150" stroke="#475569" stroke-width="2" />
    <line x1="180" y1="80" x2="260" y2="150" stroke="#475569" stroke-width="2" />
    <line x1="100" y1="150" x2="60" y2="230" stroke="#475569" stroke-width="2" />
    <line x1="100" y1="150" x2="140" y2="230" stroke="#475569" stroke-width="2" />
    <line x1="260" y1="150" x2="220" y2="230" stroke="#475569" stroke-width="2" />

    <!-- Root Node: 60 (i=0) -->
    <circle cx="180" cy="80" r="24" fill="#0284c7" stroke="#38bdf8" stroke-width="2.5" />
    <text x="180" y="85" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">60</text>
    <text x="180" y="50" font-family="sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">Root (i=0)</text>

    <!-- Level 1 Nodes -->
    <!-- Left: 40 (i=1) -->
    <circle cx="100" cy="150" r="22" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text x="100" y="155" font-family="sans-serif" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">40</text>
    <text x="60" y="155" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">i=1</text>

    <!-- Right: 50 (i=2) -->
    <circle cx="260" cy="150" r="22" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text x="260" y="155" font-family="sans-serif" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">50</text>
    <text x="300" y="155" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="start">i=2</text>

    <!-- Level 2 Nodes -->
    <!-- Left-Left: 10 (i=3) -->
    <circle cx="60" cy="230" r="20" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
    <text x="60" y="235" font-family="sans-serif" font-size="14" font-weight="600" fill="#f8fafc" text-anchor="middle">10</text>
    <text x="60" y="265" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">i=3</text>

    <!-- Left-Right: 30 (i=4) -->
    <circle cx="140" cy="230" r="20" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
    <text x="140" y="235" font-family="sans-serif" font-size="14" font-weight="600" fill="#f8fafc" text-anchor="middle">30</text>
    <text x="140" y="265" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">i=4</text>

    <!-- Right-Left: 20 (i=5) -->
    <circle cx="220" cy="230" r="20" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
    <text x="220" y="235" font-family="sans-serif" font-size="14" font-weight="600" fill="#f8fafc" text-anchor="middle">20</text>
    <text x="220" y="265" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">i=5</text>

    <!-- Max Heap Property Callout -->
    <rect x="25" y="295" width="310" height="48" rx="8" fill="#0f172a" stroke="#0284c7" stroke-dasharray="3 3" />
    <text x="180" y="315" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">
      Max Element (60) is always at the Root!
    </text>
    <text x="180" y="332" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">
      Swap root with end element → reduce size → Heapify
    </text>
  </g>

  <!-- Right: 1D Array Sequential Representation -->
  <g transform="translate(425, 85)">
    <rect width="375" height="360" rx="12" fill="#131d31" stroke="#334155" />
    <text x="187" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">
      Array Sequential Storage &amp; Index Formulas
    </text>

    <!-- Array visual -->
    <g transform="translate(20, 50)">
      <!-- Index labels -->
      <text x="26" y="0" font-family="monospace" font-size="12" fill="#64748b" text-anchor="middle">[0]</text>
      <text x="82" y="0" font-family="monospace" font-size="12" fill="#64748b" text-anchor="middle">[1]</text>
      <text x="138" y="0" font-family="monospace" font-size="12" fill="#64748b" text-anchor="middle">[2]</text>
      <text x="194" y="0" font-family="monospace" font-size="12" fill="#64748b" text-anchor="middle">[3]</text>
      <text x="250" y="0" font-family="monospace" font-size="12" fill="#64748b" text-anchor="middle">[4]</text>
      <text x="306" y="0" font-family="monospace" font-size="12" fill="#64748b" text-anchor="middle">[5]</text>

      <!-- Cells -->
      <rect x="0" y="10" width="52" height="46" rx="6" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
      <text x="26" y="38" font-family="monospace" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">60</text>

      <rect x="56" y="10" width="52" height="46" rx="6" fill="#1e293b" stroke="#38bdf8" />
      <text x="82" y="38" font-family="monospace" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle">40</text>

      <rect x="112" y="10" width="52" height="46" rx="6" fill="#1e293b" stroke="#38bdf8" />
      <text x="138" y="38" font-family="monospace" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle">50</text>

      <rect x="168" y="10" width="52" height="46" rx="6" fill="#1e293b" stroke="#64748b" />
      <text x="194" y="38" font-family="monospace" font-size="16" font-weight="700" fill="#94a3b8" text-anchor="middle">10</text>

      <rect x="224" y="10" width="52" height="46" rx="6" fill="#1e293b" stroke="#64748b" />
      <text x="250" y="38" font-family="monospace" font-size="16" font-weight="700" fill="#94a3b8" text-anchor="middle">30</text>

      <rect x="280" y="10" width="52" height="46" rx="6" fill="#1e293b" stroke="#64748b" />
      <text x="306" y="38" font-family="monospace" font-size="16" font-weight="700" fill="#94a3b8" text-anchor="middle">20</text>
    </g>

    <!-- Index Formula Reference Card -->
    <g transform="translate(20, 125)">
      <rect width="335" height="120" rx="8" fill="#0f172a" stroke="#334155" />
      <text x="15" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">Index Relationship (0-indexed):</text>
      
      <text x="15" y="52" font-family="monospace" font-size="13" fill="#f1f5f9">• Left Child(i)   = 2i + 1</text>
      <text x="235" y="52" font-family="sans-serif" font-size="11" fill="#64748b">(e.g. i=1 → left=3)</text>
      
      <text x="15" y="80" font-family="monospace" font-size="13" fill="#f1f5f9">• Right Child(i)  = 2i + 2</text>
      <text x="235" y="80" font-family="sans-serif" font-size="11" fill="#64748b">(e.g. i=1 → right=4)</text>

      <text x="15" y="108" font-family="monospace" font-size="13" fill="#f1f5f9">• Parent(i)       = ⌊(i - 1) / 2⌋</text>
    </g>

    <!-- Complexity Summary Box -->
    <g transform="translate(20, 260)">
      <rect width="335" height="85" rx="8" fill="#1e293b" stroke="#0284c7" />
      <text x="15" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">Complexity Analysis:</text>
      <text x="15" y="46" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0">• Build-Heap phase: <tspan font-weight="700" fill="#38bdf8">O(n)</tspan></text>
      <text x="15" y="68" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0">• n Extractions &amp; Heapify: <tspan font-weight="700" fill="#38bdf8">O(n log n)</tspan></text>
      <text x="210" y="57" font-family="system-ui, sans-serif" font-size="12" fill="#10b981" font-weight="700">Space: O(1)</text>
    </g>
  </g>
</svg>
