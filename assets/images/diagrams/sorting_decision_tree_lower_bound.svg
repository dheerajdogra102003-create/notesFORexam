<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="100%" height="100%">
  <defs>
    <linearGradient id="dtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="860" height="480" rx="16" fill="url(#dtBg)" stroke="#334155" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(36, 22)">
    <rect width="5" height="26" rx="2.5" fill="#38bdf8" />
    <text x="16" y="20" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">
      Comparison Sort Lower Bound: Decision Tree Model (Ω(n log n))
    </text>
    <text x="16" y="38" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
      Any comparison-based algorithm for n elements corresponds to a binary decision tree with ≥ n! leaves and height h ≥ log₂(n!).
    </text>
  </g>

  <!-- Left: Binary Decision Tree for n = 3 -->
  <g transform="translate(36, 75)">
    <rect width="450" height="380" rx="12" fill="#131d31" stroke="#334155" />
    <text x="225" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">
      Binary Decision Tree for Sorting 3 Elements [a₁, a₂, a₃]
    </text>

    <!-- Tree Edges -->
    <!-- Root to Level 1 -->
    <line x1="225" y1="65" x2="115" y2="135" stroke="#475569" stroke-width="2" />
    <text x="155" y="95" font-family="sans-serif" font-size="11" fill="#10b981">≤</text>
    <line x1="225" y1="65" x2="335" y2="135" stroke="#475569" stroke-width="2" />
    <text x="290" y="95" font-family="sans-serif" font-size="11" fill="#ef4444">&gt;</text>

    <!-- Level 1 to Level 2 -->
    <line x1="115" y1="135" x2="65" y2="205" stroke="#475569" stroke-width="1.5" />
    <line x1="115" y1="135" x2="165" y2="205" stroke="#475569" stroke-width="1.5" />

    <line x1="335" y1="135" x2="285" y2="205" stroke="#475569" stroke-width="1.5" />
    <line x1="335" y1="135" x2="385" y2="205" stroke="#475569" stroke-width="1.5" />

    <!-- Level 2 to Leaves (Level 3) -->
    <line x1="65" y1="205" x2="40" y2="275" stroke="#475569" stroke-width="1.2" />
    <line x1="65" y1="205" x2="90" y2="275" stroke="#475569" stroke-width="1.2" />

    <line x1="165" y1="205" x2="165" y2="275" stroke="#475569" stroke-width="1.2" />
    <line x1="285" y1="205" x2="285" y2="275" stroke="#475569" stroke-width="1.2" />

    <line x1="385" y1="205" x2="360" y2="275" stroke="#475569" stroke-width="1.2" />
    <line x1="385" y1="205" x2="410" y2="275" stroke="#475569" stroke-width="1.2" />

    <!-- Root Node: a1 <= a2 -->
    <rect x="180" y="48" width="90" height="34" rx="6" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
    <text x="225" y="70" font-family="monospace" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">a₁ : a₂</text>

    <!-- Level 1 Nodes -->
    <rect x="75" y="118" width="80" height="32" rx="6" fill="#1e293b" stroke="#38bdf8" />
    <text x="115" y="139" font-family="monospace" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">a₂ : a₃</text>

    <rect x="295" y="118" width="80" height="32" rx="6" fill="#1e293b" stroke="#38bdf8" />
    <text x="335" y="139" font-family="monospace" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">a₁ : a₃</text>

    <!-- Level 2 Nodes -->
    <rect x="35" y="190" width="60" height="28" rx="5" fill="#1e293b" stroke="#64748b" />
    <text x="65" y="209" font-family="monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">a₁ : a₃</text>

    <rect x="135" y="190" width="60" height="28" rx="5" fill="#1e293b" stroke="#64748b" />
    <text x="165" y="209" font-family="monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">a₁ : a₃</text>

    <rect x="255" y="190" width="60" height="28" rx="5" fill="#1e293b" stroke="#64748b" />
    <text x="285" y="209" font-family="monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">a₂ : a₃</text>

    <rect x="355" y="190" width="60" height="28" rx="5" fill="#1e293b" stroke="#64748b" />
    <text x="385" y="209" font-family="monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">a₂ : a₃</text>

    <!-- Leaves (Permutations: 3! = 6 possible outcomes) -->
    <!-- Leaf 1: <a1, a2, a3> -->
    <rect x="12" y="275" width="56" height="28" rx="4" fill="#064e3b" stroke="#10b981" />
    <text x="40" y="293" font-family="monospace" font-size="9" font-weight="700" fill="#a7f3d0" text-anchor="middle">⟨1, 2, 3⟩</text>

    <!-- Leaf 2: <a1, a3, a2> -->
    <rect x="70" y="275" width="56" height="28" rx="4" fill="#064e3b" stroke="#10b981" />
    <text x="98" y="293" font-family="monospace" font-size="9" font-weight="700" fill="#a7f3d0" text-anchor="middle">⟨1, 3, 2⟩</text>

    <!-- Leaf 3: <a3, a1, a2> -->
    <rect x="137" y="275" width="56" height="28" rx="4" fill="#064e3b" stroke="#10b981" />
    <text x="165" y="293" font-family="monospace" font-size="9" font-weight="700" fill="#a7f3d0" text-anchor="middle">⟨3, 1, 2⟩</text>

    <!-- Leaf 4: <a2, a1, a3> -->
    <rect x="257" y="275" width="56" height="28" rx="4" fill="#064e3b" stroke="#10b981" />
    <text x="285" y="293" font-family="monospace" font-size="9" font-weight="700" fill="#a7f3d0" text-anchor="middle">⟨2, 1, 3⟩</text>

    <!-- Leaf 5: <a2, a3, a1> -->
    <rect x="332" y="275" width="56" height="28" rx="4" fill="#064e3b" stroke="#10b981" />
    <text x="360" y="293" font-family="monospace" font-size="9" font-weight="700" fill="#a7f3d0" text-anchor="middle">⟨2, 3, 1⟩</text>

    <!-- Leaf 6: <a3, a2, a1> -->
    <rect x="390" y="275" width="56" height="28" rx="4" fill="#064e3b" stroke="#10b981" />
    <text x="418" y="293" font-family="monospace" font-size="9" font-weight="700" fill="#a7f3d0" text-anchor="middle">⟨3, 2, 1⟩</text>

    <!-- Tree Metrics Annotation -->
    <rect x="25" y="325" width="400" height="42" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="225" y="343" font-family="sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">
      Total Leaves L = 3! = 6 Permutations | Height h = 3 comparisons
    </text>
    <text x="225" y="358" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">
      Worst-case execution time corresponds to maximum path length from root to leaf.
    </text>
  </g>

  <!-- Right: Mathematical Proof Derivation Card -->
  <g transform="translate(506, 75)">
    <rect width="318" height="380" rx="12" fill="#131d31" stroke="#334155" />
    <text x="159" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#34d399" text-anchor="middle">
      Mathematical Proof Derivation
    </text>

    <g transform="translate(16, 45)">
      <!-- Step 1 -->
      <rect width="286" height="64" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="12" y="20" font-family="sans-serif" font-size="11" font-weight="700" fill="#38bdf8">1. Permutations &amp; Leaves:</text>
      <text x="12" y="38" font-family="sans-serif" font-size="11" fill="#e2e8f0">For n elements: L ≥ n!</text>
      <text x="12" y="52" font-family="sans-serif" font-size="10" fill="#94a3b8">Each permutation must be a distinct leaf.</text>

      <!-- Step 2 -->
      <g transform="translate(0, 74)">
        <rect width="286" height="74" rx="6" fill="#0f172a" stroke="#334155" />
        <text x="12" y="20" font-family="sans-serif" font-size="11" font-weight="700" fill="#38bdf8">2. Height of Binary Tree:</text>
        <text x="12" y="38" font-family="sans-serif" font-size="11" fill="#e2e8f0">Max leaves at height h is 2ʰ:</text>
        <text x="12" y="56" font-family="monospace" font-size="12" font-weight="700" fill="#f8fafc">2ʰ ≥ L ≥ n!  ⟹  h ≥ log₂(n!)</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 158)">
        <rect width="286" height="96" rx="6" fill="#0f172a" stroke="#334155" />
        <text x="12" y="20" font-family="sans-serif" font-size="11" font-weight="700" fill="#38bdf8">3. Stirling's Approximation:</text>
        <text x="12" y="38" font-family="monospace" font-size="11" fill="#e2e8f0">log₂(n!) = ∑ᵢ₌₁ⁿ log₂(i)</text>
        <text x="12" y="56" font-family="monospace" font-size="11" fill="#e2e8f0">≥ ∑ᵢ₌ₙ/₂ⁿ log₂(n/2)</text>
        <text x="12" y="74" font-family="monospace" font-size="11" fill="#e2e8f0">= (n/2)·log₂(n/2)</text>
        <text x="12" y="90" font-family="monospace" font-size="11" font-weight="700" fill="#34d399">= Ω(n log n)</text>
      </g>

      <!-- Conclusion -->
      <g transform="translate(0, 264)">
        <rect width="286" height="58" rx="6" fill="#064e3b" stroke="#10b981" />
        <text x="12" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#a7f3d0">Theorem Conclusion:</text>
        <text x="12" y="42" font-family="sans-serif" font-size="11" font-weight="700" fill="#ecfdf5">
          Worst-case comparisons: <tspan fill="#34d399">Ω(n log n)</tspan>
        </text>
      </g>
    </g>
  </g>
</svg>
