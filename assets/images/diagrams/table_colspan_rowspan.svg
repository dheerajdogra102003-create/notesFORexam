<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 290" width="100%" height="100%">
  <!-- Background card -->
  <rect x="0" y="0" width="780" height="290" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Main Title -->
  <text x="390" y="32" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">
    Visualizing Colspan vs Rowspan
  </text>

  <!-- ================= LEFT PANEL: COLSPAN = 2 ================= -->
  <!-- Header Badge -->
  <rect x="50" y="55" width="310" height="34" rx="6" fill="#dbeafe" />
  <text x="205" y="77" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#1e40af" text-anchor="middle">
    COLSPAN = 2 (Horizontal Merge)
  </text>

  <!-- Table Container (Left) -->
  <g transform="translate(50, 100)">
    <!-- Row 1: Merged cell spanning 2 columns -->
    <rect x="0" y="0" width="310" height="52" rx="6" fill="#bfdbfe" stroke="#2563eb" stroke-width="2" />
    <text x="155" y="32" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">
      colspan="2" (Merged 2 Columns)
    </text>

    <!-- Row 2: Two separate columns -->
    <rect x="0" y="60" width="150" height="52" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    <text x="75" y="92" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">
      Column 1
    </text>

    <rect x="160" y="60" width="150" height="52" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    <text x="235" y="92" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">
      Column 2
    </text>
  </g>
  <text x="205" y="240" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">
    Merges adjacent columns side-by-side into 1 wide cell.
  </text>

  <!-- Divider Line -->
  <line x1="390" y1="60" x2="390" y2="255" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5 5" />

  <!-- ================= RIGHT PANEL: ROWSPAN = 2 ================= -->
  <!-- Header Badge -->
  <rect x="420" y="55" width="310" height="34" rx="6" fill="#ede9fe" />
  <text x="575" y="77" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#6d28d9" text-anchor="middle">
    ROWSPAN = 2 (Vertical Merge)
  </text>

  <!-- Table Container (Right) -->
  <g transform="translate(420, 100)">
    <!-- Column 1: Merged cell spanning 2 rows -->
    <rect x="0" y="0" width="145" height="112" rx="6" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2" />
    <text x="72" y="52" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="middle">
      rowspan="2"
    </text>
    <text x="72" y="72" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="500" fill="#5b21b6" text-anchor="middle">
      (Merged 2 Rows)
    </text>

    <!-- Column 2, Row 1 -->
    <rect x="155" y="0" width="155" height="52" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    <text x="232" y="32" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">
      Row 1
    </text>

    <!-- Column 2, Row 2 -->
    <rect x="155" y="60" width="155" height="52" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    <text x="232" y="92" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">
      Row 2
    </text>
  </g>
  <text x="575" y="240" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">
    Merges stacked rows up-and-down into 1 tall cell.
  </text>
</svg>
