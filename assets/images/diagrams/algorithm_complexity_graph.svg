<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Zone Gradients -->
    <linearGradient id="horribleZone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="goodZone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.02" />
    </linearGradient>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>

    <!-- Curve Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Frame Background -->
  <rect x="0" y="0" width="820" height="520" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Graph Header -->
  <g transform="translate(40, 36)">
    <rect x="0" y="0" width="6" height="26" rx="3" fill="#6366f1" />
    <text x="16" y="20" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">
      Big-O Complexity Chart (Algorithm Efficiency)
    </text>
    <text x="16" y="42" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">
      Execution Time / Operations T(n) vs Input Size (n)
    </text>
  </g>

  <!-- Legend Badges (Top Right) -->
  <g transform="translate(470, 32)">
    <rect x="0" y="0" width="80" height="22" rx="11" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
    <circle cx="12" cy="11" r="4" fill="#10b981" />
    <text x="24" y="15" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#34d399">Excellent</text>

    <rect x="90" y="0" width="68" height="22" rx="11" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1" />
    <circle cx="102" cy="11" r="4" fill="#f59e0b" />
    <text x="114" y="15" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#fbbf24">Fair</text>

    <rect x="168" y="0" width="64" height="22" rx="11" fill="#f97316" fill-opacity="0.2" stroke="#f97316" stroke-width="1" />
    <circle cx="180" cy="11" r="4" fill="#f97316" />
    <text x="192" y="15" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#fb923c">Bad</text>

    <rect x="242" y="0" width="80" height="22" rx="11" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1" />
    <circle cx="254" cy="11" r="4" fill="#ef4444" />
    <text x="266" y="15" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#f87171">Horrible</text>
  </g>

  <!-- Coordinate System Origin: (100, 440) ; Width: 660, Height: 330 -->
  <g>
    <!-- Background Area Shading -->
    <!-- Horrible Zone Shading (Upper Left triangle) -->
    <path d="M 100 440 L 100 110 L 320 110 Z" fill="url(#horribleZone)" />
    <!-- Good Zone Shading (Lower Right region) -->
    <path d="M 100 440 L 760 440 L 760 380 L 100 435 Z" fill="url(#goodZone)" />

    <!-- Grid Lines (Horizontal) -->
    <line x1="100" y1="360" x2="760" y2="360" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.6" />
    <line x1="100" y1="280" x2="760" y2="280" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.6" />
    <line x1="100" y1="200" x2="760" y2="200" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.6" />
    <line x1="100" y1="120" x2="760" y2="120" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.6" />

    <!-- Grid Lines (Vertical) -->
    <line x1="265" y1="110" x2="265" y2="440" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.5" />
    <line x1="430" y1="110" x2="430" y2="440" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.5" />
    <line x1="595" y1="110" x2="595" y2="440" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.5" />

    <!-- Axes -->
    <!-- Y-Axis -->
    <line x1="100" y1="440" x2="100" y2="95" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)" />
    <!-- X-Axis -->
    <line x1="100" y1="440" x2="780" y2="440" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)" />

    <!-- Axis Labels -->
    <text x="775" y="472" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#cbd5e1" text-anchor="end">
      Input Size (n) →
    </text>
    <text x="45" y="85" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#cbd5e1">
      ↑ Operations / Time Taken T(n)
    </text>

    <!-- Origin Tick -->
    <text x="92" y="458" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="end">0</text>
  </g>

  <!-- Complexity Curves -->

  <!-- 1. O(1) - Constant Time (Green) -->
  <g>
    <line x1="100" y1="428" x2="750" y2="428" stroke="#10b981" stroke-width="3" />
    <circle cx="750" cy="428" r="4.5" fill="#10b981" />
    <rect x="670" y="405" width="85" height="18" rx="4" fill="#0f172a" fill-opacity="0.8" />
    <text x="755" y="420" font-family="system-ui, monospace, sans-serif" font-size="13" font-weight="700" fill="#34d399" text-anchor="end">
      O(1) Constant
    </text>
  </g>

  <!-- 2. O(log n) - Logarithmic Time (Teal/Cyan) -->
  <g>
    <!-- Starts at (100, 438), smoothly flattens out -->
    <path d="M 100 438 Q 280 410, 480 392 T 750 375" fill="none" stroke="#06b6d4" stroke-width="3" />
    <circle cx="750" cy="375" r="4.5" fill="#06b6d4" />
    <rect x="640" y="352" width="115" height="18" rx="4" fill="#0f172a" fill-opacity="0.8" />
    <text x="755" y="367" font-family="system-ui, monospace, sans-serif" font-size="13" font-weight="700" fill="#22d3ee" text-anchor="end">
      O(log n) Logarithmic
    </text>
  </g>

  <!-- 3. O(n) - Linear Time (Amber/Yellow) -->
  <g>
    <line x1="100" y1="440" x2="680" y2="210" stroke="#f59e0b" stroke-width="3" />
    <circle cx="680" cy="210" r="4.5" fill="#f59e0b" />
    <rect x="645" y="188" width="90" height="18" rx="4" fill="#0f172a" fill-opacity="0.8" />
    <text x="690" y="202" font-family="system-ui, monospace, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">
      O(n) Linear
    </text>
  </g>

  <!-- 4. O(n log n) - Linearithmic Time (Orange) -->
  <g>
    <path d="M 100 440 Q 320 340, 520 190 T 575 115" fill="none" stroke="#f97316" stroke-width="3" />
    <circle cx="575" cy="115" r="4.5" fill="#f97316" />
    <rect x="585" y="105" width="135" height="18" rx="4" fill="#0f172a" fill-opacity="0.8" />
    <text x="590" y="120" font-family="system-ui, monospace, sans-serif" font-size="13" font-weight="700" fill="#fb923c">
      O(n log n) Quasilinear
    </text>
  </g>

  <!-- 5. O(n^2) - Quadratic Time (Red) -->
  <g>
    <path d="M 100 440 Q 220 380, 310 240 T 365 110" fill="none" stroke="#ef4444" stroke-width="3.5" filter="url(#glow)" />
    <circle cx="365" cy="110" r="4.5" fill="#ef4444" />
    <rect x="375" y="102" width="125" height="18" rx="4" fill="#0f172a" fill-opacity="0.8" />
    <text x="380" y="117" font-family="system-ui, monospace, sans-serif" font-size="13" font-weight="700" fill="#f87171">
      O(n²) Quadratic
    </text>
  </g>

  <!-- 6. O(2^n) - Exponential Time (Fuchsia/Purple) -->
  <g>
    <path d="M 100 440 Q 150 410, 185 280 T 210 110" fill="none" stroke="#ec4899" stroke-width="3.5" stroke-dasharray="6 2" filter="url(#glow)" />
    <circle cx="210" cy="110" r="4.5" fill="#ec4899" />
    <rect x="220" y="102" width="135" height="18" rx="4" fill="#0f172a" fill-opacity="0.8" />
    <text x="225" y="117" font-family="system-ui, monospace, sans-serif" font-size="13" font-weight="700" fill="#f472b6">
      O(2ⁿ) Exponential
    </text>
  </g>

  <!-- 7. O(n!) - Factorial Time (Crimson) -->
  <g>
    <path d="M 100 440 Q 120 400, 135 240 T 145 110" fill="none" stroke="#dc2626" stroke-width="3.5" />
    <circle cx="145" cy="110" r="4.5" fill="#dc2626" />
    <text x="153" y="135" font-family="system-ui, monospace, sans-serif" font-size="12.5" font-weight="700" fill="#fca5a5">
      O(n!) Factorial
    </text>
  </g>

  <!-- Bottom Explanatory Strip -->
  <g transform="translate(100, 482)">
    <rect x="0" y="0" width="660" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="330" y="18" font-family="system-ui, sans-serif" font-size="11.5" fill="#94a3b8" text-anchor="middle">
      Efficiency Order: <tspan fill="#34d399" font-weight="700">O(1)</tspan> &lt; <tspan fill="#22d3ee" font-weight="700">O(log n)</tspan> &lt; <tspan fill="#fbbf24" font-weight="700">O(n)</tspan> &lt; <tspan fill="#fb923c" font-weight="700">O(n log n)</tspan> &lt; <tspan fill="#f87171" font-weight="700">O(n²)</tspan> &lt; <tspan fill="#f472b6" font-weight="700">O(2ⁿ)</tspan> &lt; <tspan fill="#dc2626" font-weight="700">O(n!)</tspan>
    </text>
  </g>
</svg>
