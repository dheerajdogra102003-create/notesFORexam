<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <marker id="tourArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 10 5 L 0 8 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(36, 26)">
    <rect width="5" height="26" rx="2.5" fill="#6366f1" />
    <text x="16" y="20" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">
      Travelling Salesperson Problem (TSP) — Optimal Hamiltonian Tour
    </text>
    <text x="16" y="38" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
      Visit every city exactly once and return to starting origin with minimum total edge weight
    </text>
  </g>

  <!-- Left: 4-City Graph Visual -->
  <g transform="translate(40, 80)">
    <rect width="420" height="370" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="1.5" />

    <!-- Inactive / Alternate Edges (Dashed) -->
    <!-- Edge 1-4 -->
    <line x1="120" y1="100" x2="300" y2="280" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4" />
    <rect x="195" y="180" width="30" height="18" rx="4" fill="#1e293b" stroke="#334155" />
    <text x="210" y="193" font-family="sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle">20</text>

    <!-- Edge 2-3 -->
    <line x1="300" y1="100" x2="120" y2="280" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4" />
    <rect x="195" y="145" width="30" height="18" rx="4" fill="#1e293b" stroke="#334155" />
    <text x="210" y="158" font-family="sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle">35</text>

    <!-- Optimal Tour Edges (Highlighted Green with Directional Arrows) -->
    <!-- 1 -> 2 (weight 10) -->
    <line x1="145" y1="100" x2="275" y2="100" stroke="#10b981" stroke-width="3" marker-end="url(#tourArrow)" />
    <rect x="195" y="76" width="30" height="20" rx="4" fill="#065f46" stroke="#10b981" />
    <text x="210" y="90" font-family="sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">10</text>

    <!-- 2 -> 4 (weight 25) -->
    <line x1="300" y1="125" x2="300" y2="255" stroke="#10b981" stroke-width="3" marker-end="url(#tourArrow)" />
    <rect x="312" y="180" width="30" height="20" rx="4" fill="#065f46" stroke="#10b981" />
    <text x="327" y="194" font-family="sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">25</text>

    <!-- 4 -> 3 (weight 30) -->
    <line x1="275" y1="280" x2="145" y2="280" stroke="#10b981" stroke-width="3" marker-end="url(#tourArrow)" />
    <rect x="195" y="288" width="30" height="20" rx="4" fill="#065f46" stroke="#10b981" />
    <text x="210" y="302" font-family="sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">30</text>

    <!-- 3 -> 1 (weight 15) -->
    <line x1="120" y1="255" x2="120" y2="125" stroke="#10b981" stroke-width="3" marker-end="url(#tourArrow)" />
    <rect x="78" y="180" width="30" height="20" rx="4" fill="#065f46" stroke="#10b981" />
    <text x="93" y="194" font-family="sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">15</text>

    <!-- City Nodes -->
    <!-- City 1 (Start) -->
    <circle cx="120" cy="100" r="24" fill="#4338ca" stroke="#818cf8" stroke-width="2.5" />
    <text x="120" y="96" font-family="sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">1</text>
    <text x="120" y="112" font-family="sans-serif" font-size="9" fill="#c7d2fe" text-anchor="middle">START</text>

    <!-- City 2 -->
    <circle cx="300" cy="100" r="22" fill="url(#cityGrad)" stroke="#a5b4fc" stroke-width="2" />
    <text x="300" y="106" font-family="sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">2</text>

    <!-- City 3 -->
    <circle cx="120" cy="280" r="22" fill="url(#cityGrad)" stroke="#a5b4fc" stroke-width="2" />
    <text x="120" y="286" font-family="sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">3</text>

    <!-- City 4 -->
    <circle cx="300" cy="280" r="22" fill="url(#cityGrad)" stroke="#a5b4fc" stroke-width="2" />
    <text x="300" y="286" font-family="sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">4</text>

    <!-- Tour Banner at Bottom -->
    <rect x="20" y="325" width="380" height="32" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <text x="210" y="346" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#a7f3d0" text-anchor="middle">
      Optimal Tour: 1 → 2 → 4 → 3 → 1 (Total Cost = 80)
    </text>
  </g>

  <!-- Right: Algorithm Complexity Comparison Card -->
  <g transform="translate(480, 80)">
    <rect width="280" height="370" rx="12" fill="#090d16" stroke="#334155" stroke-width="1.5" />
    <text x="16" y="28" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">
      TSP Approaches Comparison
    </text>

    <!-- Approach 1: Brute Force -->
    <g transform="translate(16, 45)">
      <rect width="248" height="72" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1" />
      <text x="12" y="20" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#f87171">1. Brute-Force (All Tours)</text>
      <text x="12" y="38" font-family="sans-serif" font-size="10.5" fill="#cbd5e1">• Evaluates (n - 1)! / 2 tours</text>
      <text x="12" y="55" font-family="sans-serif" font-size="10.5" fill="#fca5a5">• Time: O(n!) | Impractical n &gt; 12</text>
    </g>

    <!-- Approach 2: Greedy -->
    <g transform="translate(16, 128)">
      <rect width="248" height="72" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
      <text x="12" y="20" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#fbbf24">2. Greedy (Nearest Neighbor)</text>
      <text x="12" y="38" font-family="sans-serif" font-size="10.5" fill="#cbd5e1">• Picks nearest unvisited city</text>
      <text x="12" y="55" font-family="sans-serif" font-size="10.5" fill="#fde68a">• Time: O(n²) | Not always optimal</text>
    </g>

    <!-- Approach 3: Held-Karp DP -->
    <g transform="translate(16, 211)">
      <rect width="248" height="80" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
      <text x="12" y="20" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#34d399">3. Held-Karp DP (Optimal)</text>
      <text x="12" y="38" font-family="sans-serif" font-size="10.5" fill="#e2e8f0">• Solves subset subproblems C(S, i)</text>
      <text x="12" y="55" font-family="sans-serif" font-size="10.5" fill="#a7f3d0">• Time: O(n² · 2ⁿ) | Optimal</text>
      <text x="12" y="70" font-family="sans-serif" font-size="9.5" fill="#6ee7b7">• Feasible up to n ≤ 20 cities</text>
    </g>

    <!-- Key Formula Note -->
    <g transform="translate(16, 302)">
      <rect width="248" height="52" rx="6" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1" />
      <text x="12" y="20" font-family="sans-serif" font-size="10" font-weight="600" fill="#c7d2fe">Held-Karp Recurrence:</text>
      <text x="12" y="38" font-family="mono, sans-serif" font-size="9.5" fill="#38bdf8">C(S,i) = min { C(S\{i},j) + d(j,i) }</text>
    </g>
  </g>
</svg>
