<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 180" width="100%" height="100%">
  <!-- Background Canvas -->
  <rect x="0" y="0" width="620" height="180" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Outer Frameset Window -->
  <rect x="25" y="25" width="570" height="130" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2" />

  <!-- Left Frame: Menu (25%) -->
  <rect x="25" y="25" width="160" height="130" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="105" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1e40af" text-anchor="middle">
    📋 Menu Frame (25%)
  </text>
  <text x="105" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">
    src="menu.html"
  </text>
  <line x1="45" y1="90" x2="165" y2="90" stroke="#bfdbfe" stroke-width="1" />
  <text x="105" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle">
    🔗 Navigation Links
  </text>
  <text x="105" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">
    (Remains Fixed)
  </text>

  <!-- Right Frame: Content (75%) -->
  <rect x="185" y="25" width="410" height="130" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" />
  <text x="390" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">
    📄 Content Frame (75%)
  </text>
  <text x="390" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">
    src="content.html"
  </text>
  <line x1="210" y1="90" x2="570" y2="90" stroke="#bbf7d0" stroke-width="1" />
  <text x="390" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#166534" text-anchor="middle">
    Page Information &amp; Articles
  </text>
  <text x="390" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#86efac" text-anchor="middle">
    (Only this section reloads)
  </text>
</svg>
