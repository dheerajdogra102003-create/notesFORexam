<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" width="100%" height="100%">
  <defs>
    <linearGradient id="strBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="840" height="460" rx="16" fill="url(#strBg)" stroke="#334155" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(36, 24)">
    <rect width="5" height="26" rx="2.5" fill="#f43f5e" />
    <text x="16" y="20" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">
      Brute-Force String Matching: Sliding Window Trace
    </text>
    <text x="16" y="38" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
      Text T = "ABABCABC" (n=8) | Pattern P = "ABC" (m=3) | Sliding window tests each alignment shift i
    </text>
  </g>

  <!-- Text Array (Global Reference) -->
  <g transform="translate(36, 75)">
    <rect width="130" height="44" rx="6" fill="#1e293b" stroke="#475569" />
    <text x="65" y="27" font-family="sans-serif" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="middle">Text T (n=8)</text>

    <!-- Cells 0 to 7 -->
    <g transform="translate(150, 0)">
      <!-- Index indicators -->
      <text x="24" y="-6" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">0</text>
      <text x="74" y="-6" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">1</text>
      <text x="124" y="-6" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">2</text>
      <text x="174" y="-6" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">3</text>
      <text x="224" y="-6" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">4</text>
      <text x="274" y="-6" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">5</text>
      <text x="324" y="-6" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">6</text>
      <text x="374" y="-6" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">7</text>

      <g transform="translate(0, 0)"><rect width="48" height="44" rx="6" fill="#1e293b" stroke="#334155" /><text x="24" y="28" font-family="monospace" font-size="17" font-weight="700" fill="#f8fafc" text-anchor="middle">A</text></g>
      <g transform="translate(50, 0)"><rect width="48" height="44" rx="6" fill="#1e293b" stroke="#334155" /><text x="24" y="28" font-family="monospace" font-size="17" font-weight="700" fill="#f8fafc" text-anchor="middle">B</text></g>
      <g transform="translate(100, 0)"><rect width="48" height="44" rx="6" fill="#1e293b" stroke="#334155" /><text x="24" y="28" font-family="monospace" font-size="17" font-weight="700" fill="#f8fafc" text-anchor="middle">A</text></g>
      <g transform="translate(150, 0)"><rect width="48" height="44" rx="6" fill="#1e293b" stroke="#334155" /><text x="24" y="28" font-family="monospace" font-size="17" font-weight="700" fill="#f8fafc" text-anchor="middle">B</text></g>
      <g transform="translate(200, 0)"><rect width="48" height="44" rx="6" fill="#1e293b" stroke="#334155" /><text x="24" y="28" font-family="monospace" font-size="17" font-weight="700" fill="#f8fafc" text-anchor="middle">C</text></g>
      <g transform="translate(250, 0)"><rect width="48" height="44" rx="6" fill="#1e293b" stroke="#334155" /><text x="24" y="28" font-family="monospace" font-size="17" font-weight="700" fill="#f8fafc" text-anchor="middle">A</text></g>
      <g transform="translate(300, 0)"><rect width="48" height="44" rx="6" fill="#1e293b" stroke="#334155" /><text x="24" y="28" font-family="monospace" font-size="17" font-weight="700" fill="#f8fafc" text-anchor="middle">B</text></g>
      <g transform="translate(350, 0)"><rect width="48" height="44" rx="6" fill="#1e293b" stroke="#334155" /><text x="24" y="28" font-family="monospace" font-size="17" font-weight="700" fill="#f8fafc" text-anchor="middle">C</text></g>
    </g>
  </g>

  <!-- Shift 0: i = 0 -->
  <g transform="translate(36, 145)">
    <rect width="130" height="48" rx="6" fill="#1e293b" stroke="#f43f5e" />
    <text x="65" y="22" font-family="sans-serif" font-size="12" font-weight="700" fill="#fb7185" text-anchor="middle">Shift i = 0</text>
    <text x="65" y="38" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">3 Comparisons</text>

    <!-- Pattern at offset 0 -->
    <g transform="translate(150, 0)">
      <g transform="translate(0, 0)"><rect width="48" height="44" rx="6" fill="#064e3b" stroke="#10b981" /><text x="24" y="28" font-family="monospace" font-size="16" font-weight="700" fill="#a7f3d0" text-anchor="middle">A ✓</text></g>
      <g transform="translate(50, 0)"><rect width="48" height="44" rx="6" fill="#064e3b" stroke="#10b981" /><text x="24" y="28" font-family="monospace" font-size="16" font-weight="700" fill="#a7f3d0" text-anchor="middle">B ✓</text></g>
      <g transform="translate(100, 0)"><rect width="48" height="44" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="2" /><text x="24" y="28" font-family="monospace" font-size="16" font-weight="700" fill="#fca5a5" text-anchor="middle">C ✗</text></g>
    </g>
    <text x="580" y="28" font-family="sans-serif" font-size="12" fill="#ef4444">T[2]='A' ≠ P[2]='C' → Mismatch at j=2</text>
  </g>

  <!-- Shift 1: i = 1 -->
  <g transform="translate(36, 210)">
    <rect width="130" height="48" rx="6" fill="#1e293b" stroke="#f59e0b" />
    <text x="65" y="22" font-family="sans-serif" font-size="12" font-weight="700" fill="#f59e0b" text-anchor="middle">Shift i = 1</text>
    <text x="65" y="38" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">1 Comparison</text>

    <!-- Pattern at offset 1 -->
    <g transform="translate(200, 0)">
      <g transform="translate(0, 0)"><rect width="48" height="44" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="2" /><text x="24" y="28" font-family="monospace" font-size="16" font-weight="700" fill="#fca5a5" text-anchor="middle">A ✗</text></g>
      <g transform="translate(50, 0)"><rect width="48" height="44" rx="6" fill="#0f172a" stroke="#334155" opacity="0.3" /><text x="24" y="28" font-family="monospace" font-size="16" fill="#64748b" text-anchor="middle">B</text></g>
      <g transform="translate(100, 0)"><rect width="48" height="44" rx="6" fill="#0f172a" stroke="#334155" opacity="0.3" /><text x="24" y="28" font-family="monospace" font-size="16" fill="#64748b" text-anchor="middle">C</text></g>
    </g>
    <text x="580" y="28" font-family="sans-serif" font-size="12" fill="#f59e0b">T[1]='B' ≠ P[0]='A' → Mismatch at j=0</text>
  </g>

  <!-- Shift 2: i = 2 (MATCH!) -->
  <g transform="translate(36, 275)">
    <rect width="130" height="48" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="2" />
    <text x="65" y="22" font-family="sans-serif" font-size="12" font-weight="800" fill="#34d399" text-anchor="middle">Shift i = 2</text>
    <text x="65" y="38" font-family="sans-serif" font-size="10" fill="#a7f3d0" text-anchor="middle">3 Comparisons</text>

    <!-- Pattern at offset 2 -->
    <g transform="translate(250, 0)">
      <g transform="translate(0, 0)"><rect width="48" height="44" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="2" /><text x="24" y="28" font-family="monospace" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">A ✓</text></g>
      <g transform="translate(50, 0)"><rect width="48" height="44" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="2" /><text x="24" y="28" font-family="monospace" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">B ✓</text></g>
      <g transform="translate(100, 0)"><rect width="48" height="44" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="2" /><text x="24" y="28" font-family="monospace" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">C ✓</text></g>
    </g>
    <text x="580" y="28" font-family="sans-serif" font-size="13" font-weight="700" fill="#10b981">✓ EXACT MATCH FOUND AT INDEX 2!</text>
  </g>

  <!-- Summary Footer -->
  <g transform="translate(36, 345)">
    <rect width="768" height="92" rx="10" fill="#0f172a" stroke="#334155" />
    <g transform="translate(20, 18)">
      <text x="0" y="16" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f43f5e">Complexity Breakdown:</text>
      <text x="0" y="40" font-family="sans-serif" font-size="12" fill="#cbd5e1">• <tspan font-weight="600" fill="#f8fafc">Worst-Case Time:</tspan> O((n - m + 1) · m) ≈ <tspan fill="#fb7185" font-weight="700">O(n · m)</tspan> (occurs on repetitive texts like "AAAAAA" and pattern "AAAAB").</text>
      <text x="0" y="60" font-family="sans-serif" font-size="12" fill="#cbd5e1">• <tspan font-weight="600" fill="#f8fafc">Best-Case Time:</tspan> <tspan fill="#10b981" font-weight="700">O(m)</tspan> (found at first position) or O(n) when first characters immediately mismatch.</text>
      <text x="590" y="40" font-family="sans-serif" font-size="12" fill="#38bdf8">Space Complexity: <tspan font-weight="700" fill="#f8fafc">O(1)</tspan></text>
    </g>
  </g>
</svg>
